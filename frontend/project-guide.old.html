<!DOCTYPE html>
<html lang="fr">

<head>
     <meta charset="utf-8" />
     <title>Guide du projet | Réassort Automatique</title>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta http-equiv="X-UA-Compatible" content="IE=edge" />
     <link rel="icon" type="image/png" href="assets/images/logo-reassort.png">

     <link type="text/css" href="assets/volt/css/volt.css" rel="stylesheet">
     <link type="text/css" href="assets/css/theme.css" rel="stylesheet">
    <link type="text/css" href="assets/css/theme-override.css" rel="stylesheet">

     <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1/dist/iconify-icon.min.js"></script>

     <script src="assets/js/config.js"></script>
     <script src="assets/js/backend-config.js"></script>
     <script src="assets/js/reassort-auth.js"></script>
     <script src="assets/js/shop-picker.js"></script>

     <style>
          .sidebar .nav, .sidebar .multi-level .nav { white-space: normal; }

          /* Page "Guide du projet" (23/09/2026) : documentation métier de référence, écrite en
             langage simple pour un lecteur non technique. Pattern visuel volontairement sobre
             (cartes blanches, filets fins), cohérent avec le reste du site déjà migré vers ce style. */

          /* Le sommaire doit rester visible pendant le défilement, mais `position: sticky` ne
             fonctionne pas ici : Volt pose `overflow: hidden` sur <main class="content">, ce qui
             casse le contexte de défilement nécessaire à sticky (constaté le 23/09/2026 — le
             sommaire disparaissait entièrement dès qu'on scrollait). `position: fixed`, avec sa
             position horizontale calculée en JS (project-guide.js, alignée sur sa colonne réelle),
             contourne ce problème en s'accrochant directement au viewport plutôt qu'à un ancêtre. */
          .pg-toc {
               position: fixed;
               top: 1.25rem;
               width: 260px;
               max-height: calc(100vh - 2.5rem);
               overflow-y: auto;
          }
          .pg-toc-group-title {
               font-size: .7rem;
               font-weight: 700;
               text-transform: uppercase;
               letter-spacing: .05em;
               color: #6c757d;
               margin: 1.1rem 0 .4rem;
          }
          .pg-toc-group-title:first-child { margin-top: 0; }
          .pg-toc a {
               display: block;
               padding: .35rem .7rem;
               font-size: .85rem;
               color: #374151;
               text-decoration: none;
               border-left: 2px solid transparent;
               border-radius: 0 4px 4px 0;
               transition: background-color .15s ease, color .15s ease, border-color .15s ease, padding-left .15s ease;
          }
          .pg-toc a:hover { background-color: #f5f5f5; color: #111111; padding-left: .9rem; }
          .pg-toc a.active {
               border-left-color: #111111;
               color: #111111;
               font-weight: 600;
               background-color: #f5f5f5;
          }

          /* Petite animation d'apparition au défilement (23/09/2026, demande explicite : "plus
             visible et réactif") : chaque section apparaît en glissant légèrement vers le haut la
             première fois qu'elle entre dans le viewport (IntersectionObserver, project-guide.js),
             jamais rejouée ensuite pour ne pas distraire lors d'un simple aller-retour au scroll.
             Respecte prefers-reduced-motion (aucune animation si l'utilisateur l'a désactivée). */
          .pg-section {
               scroll-margin-top: 1rem;
               padding-top: .5rem;
               margin-bottom: 2.5rem;
               opacity: 0;
               transform: translateY(14px);
               transition: opacity .5s ease, transform .5s ease;
          }
          .pg-section.pg-visible { opacity: 1; transform: translateY(0); }
          @media (prefers-reduced-motion: reduce) {
               .pg-section { opacity: 1; transform: none; transition: none; }
          }

          .pg-section-header {
               display: flex;
               align-items: center;
               gap: .6rem;
               margin-bottom: .5rem;
          }
          .pg-section-header iconify-icon { font-size: 1.4rem; color: #111111; }
          .pg-section-title { font-size: 1.35rem; font-weight: 700; margin: 0; }

          .pg-status-badge {
               font-size: .68rem;
               font-weight: 700;
               text-transform: uppercase;
               letter-spacing: .03em;
               padding: .2rem .55rem;
               border: 1px solid transparent;
          }
          .pg-status-done { background-color: #ECFDF5; color: #047857; border-color: #A7F3D0; }
          .pg-status-partial { background-color: #FFFBEB; color: #B45309; border-color: #FDE68A; }
          .pg-status-planned { background-color: #F3F4F6; color: #6B7280; border-color: #E5E7EB; }

          .pg-card {
               background-color: #ffffff;
               border: 1px solid #e5e5e5;
               box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.08);
               padding: 1.25rem 1.5rem;
               margin-bottom: 1rem;
               transition: box-shadow .2s ease, border-color .2s ease;
          }
          .pg-card:hover {
               border-color: #d1d5db;
               box-shadow: 0 2px 8px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.08);
          }
          .pg-card-label {
               font-size: .75rem;
               font-weight: 700;
               text-transform: uppercase;
               letter-spacing: .03em;
               color: #6c757d;
               margin-bottom: .5rem;
          }
          .pg-card p:last-child { margin-bottom: 0; }
          .pg-tech-note {
               font-size: .8rem;
               color: #6c757d;
               background-color: #fafafa;
               border-left: 3px solid #d1d5db;
               padding: .6rem .9rem;
               margin-top: .75rem;
          }
          .pg-page-links a {
               display: inline-flex;
               align-items: center;
               gap: .3rem;
               font-size: .85rem;
               border: 1px solid #d1d5db;
               padding: .3rem .75rem;
               margin: .15rem .35rem .15rem 0;
               text-decoration: none;
               color: #111111;
               transition: background-color .15s ease, border-color .15s ease, transform .15s ease;
          }
          .pg-page-links a:hover { background-color: #111111; color: #ffffff; border-color: #111111; transform: translateY(-1px); }

          /* Barre de progression de lecture (23/09/2026) : filet fin en haut de page, indique
             visuellement combien reste à lire — retour visuel réactif au scroll demandé. */
          #pg-progress-bar {
               position: fixed;
               top: 0;
               left: 0;
               height: 3px;
               width: 0%;
               background-color: #111111;
               z-index: 1050;
               transition: width .1s linear;
          }

          @media (max-width: 991px) {
               .pg-toc { position: static; width: auto; max-height: none; margin-bottom: 2rem; }
               #pg-progress-bar { display: none; }
          }
     </style>
</head>

<body data-page-title="Guide du projet">

     <script src="assets/js/loading-overlay.js"></script>

     <div id="layout-sidebar-slot"></div>
     <div id="pg-progress-bar"></div>

     <button type="button" id="reset-layout" class="visually-hidden" aria-hidden="true" tabindex="-1"></button>

     <main class="content">
          <div id="layout-topbar-slot"></div>
          <script src="assets/js/layout.js"></script>
          <script src="assets/js/global-shop-selector.js"></script>

          <div class="py-4">
               <div class="container-xxl">

                    <div class="mb-4">
                         <h2 class="mb-1">Guide du projet</h2>
                         <p class="text-muted mb-0">
                              Ce que fait chaque fonctionnalité, pourquoi elle existe, et où la trouver — pensé pour
                              quelqu'un qui découvre le projet ou veut mieux comprendre une fonctionnalité précise.
                         </p>
                    </div>

                    <div class="row">
                         <div class="col-lg-3 d-none d-lg-block" id="pg-toc-col">
                              <nav class="pg-toc" id="pg-toc"></nav>
                         </div>
                         <div class="col-lg-9" id="pg-content">
                              <!-- Rempli par pg-sections.js -->
                         </div>
                    </div>

               </div>
          </div>
     </main>

     <script src="assets/volt/vendor/@popperjs/core/dist/umd/popper.min.js"></script>
     <script src="assets/volt/vendor/bootstrap/dist/js/bootstrap.min.js"></script>
     <script src="assets/volt/vendor/simplebar/dist/simplebar.min.js"></script>
     <script src="assets/js/project-guide-content.js"></script>
     <script src="assets/js/project-guide.js"></script>
     <script src="assets/js/notifications-bell.js"></script>
     <script src="assets/js/ai-assistant-widget.js"></script>

</body>

</html>
