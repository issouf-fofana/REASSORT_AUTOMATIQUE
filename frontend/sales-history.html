<!DOCTYPE html>
<html lang="en">

<head>
     <!-- Title Meta -->
     <meta charset="utf-8" />
     <title>Ventes synchronisées | Réassort Automatique</title>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta http-equiv="X-UA-Compatible" content="IE=edge" />
     <link rel="icon" type="image/png" href="assets/images/logo-reassort.png">

     <!-- Volt Bootstrap 5 Dashboard (page pilote de migration) : CSS compilée depuis
          template-volt-src/ + template/volt-bootstrap-5-dashboard (gulp build:dev), copiée dans
          assets/volt/. Remplace entièrement vendor.min.css/icons.min.css/app.min.css (Larkon). -->
     <link type="text/css" href="assets/volt/css/volt.css" rel="stylesheet">
     <link type="text/css" href="assets/css/theme-override.css" rel="stylesheet">

     <!-- Iconify (icônes <iconify-icon> déjà utilisées partout dans cette page) : Larkon la fournissait
          via vendor.js, absent du build Volt. Chargée séparément pour ne pas réécrire ~30 icônes. -->
     <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1/dist/iconify-icon.min.js"></script>

     <!-- AG Grid Community (migration du tableau des ventes, même pattern que purchase-order-v2.html) :
          tri/filtre par colonne + export CSV en JS vanilla. Pas d'Enterprise (licence payante non
          configurée sur ce projet) : export CSV uniquement, ouvrable directement dans Excel. -->
     <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@33/dist/ag-grid-community.min.js"></script>
     <script src="assets/js/ag-grid-setup.js"></script>
     <script src="assets/js/ag-grid-locale-fr.js"></script>

     <!-- Theme Config js (Require in all Page) -->
     <script src="assets/js/config.js"></script>
    <script src="assets/js/backend-config.js"></script>
    <script src="assets/js/reassort-auth.js"></script>
    <script src="assets/js/shop-picker.js"></script>

    <style>
         .step-icon-wrap { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
         .step-icon-wrap iconify-icon { font-size: 20px; }
         .step-icon-wrap.state-active iconify-icon { animation: step-spin 1s linear infinite; }
         @keyframes step-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
         .validation-step { transition: background-color .3s ease, opacity .3s ease; opacity: .55; }
         .validation-step.state-active, .validation-step.state-done, .validation-step.state-error { opacity: 1; }
         .validation-step.state-active { background-color: rgba(35, 97, 206, .06); }
         /* Volt attend des libellés de menu courts (nowrap) ; les nôtres sont plus longs
            ("Proposition de commande"...) donc on autorise le retour à la ligne pour éviter
            le débordement horizontal du panneau latéral. */
         .sidebar .nav, .sidebar .multi-level .nav { white-space: normal; }

         /* Habillage AG Grid pour coller au thème du site (palette noir/blanc/gris stricte, aucun
            coin arrondi, police Inter). Migration vers la Theming API v33 (23/09/2026) :
            window.REASSORT_AG_GRID_THEME_SOFT (ag-grid-setup.js) fournit les mêmes couleurs en JS. */
         #sh-grid {
              width: 100%;
         }
         /* Ligne d'en-tête de groupe par rayon (voir groupHeaderRow/withDepartmentGroupHeaders) : fond
            gris + gras, même esprit visuel que l'ancien table-secondary Bootstrap. */
         .sh-group-header-row {
              display: flex;
              align-items: center;
              height: 100%;
              padding: 0 12px;
              background-color: #f1f3f5;
              font-weight: 600;
              color: #1a1a1a;
              border-bottom: 1px solid #dee2e6;
         }

         /* Style "impeccable" (23/09/2026, même pattern que admin-dashboard.html) : remplace les 4
            cartes identiques (une par chiffre) par un relevé en filets fins — plus dense, moins
            "mur de cartes SaaS générique", cohérent avec le reste du site déjà migré. */
         .sh-metric-row {
              display: flex;
              flex-wrap: wrap;
         }
         .sh-metric-row-item {
              flex: 1 1 180px;
              padding: 1rem 1.5rem 1rem 0;
              border-right: 1px solid var(--bs-border-color, #dee2e6);
         }
         .sh-metric-row-item:last-child { border-right: none; }
         .sh-metric-label {
              font-size: .8125rem;
              color: var(--bs-secondary-color, #6c757d);
              margin: 0 0 .35rem;
         }
         .sh-metric-value {
              font-size: 1.5rem;
              font-weight: 600;
              line-height: 1.15;
              font-variant-numeric: tabular-nums;
              margin: 0;
         }
         @media (max-width: 767px) {
              .sh-metric-row-item { border-right: none; border-bottom: 1px solid var(--bs-border-color, #dee2e6); }
         }
    </style>
</head>

<body data-page-title="Ventes synchronisées">

     <script src="assets/js/loading-overlay.js"></script>

     <div id="layout-sidebar-slot"></div>

     <button type="button" id="reset-layout" class="visually-hidden" aria-hidden="true" tabindex="-1"></button>

     <main class="content">
          <div id="layout-topbar-slot"></div>
          <script src="assets/js/layout.js"></script>
          <script src="assets/js/global-shop-selector.js"></script>

          <div class="py-4">
               <div class="container-xxl">               <!-- Start Container Fluid -->

                    <div class="row mb-3">
                         <div class="col-12">
                              <div class="card">
                                   <div class="card-body">
                                        <div class="row g-2 align-items-end">
                                             <div class="col-md-4">
                                                  <label class="form-label small">Magasin</label>
                                                  <select id="sh-shop" class="form-select"><option value="">Chargement...</option></select>
                                             </div>
                                             <div class="col-md-2">
                                                  <label class="form-label small">Date de début</label>
                                                  <input type="date" id="sh-date-start" class="form-control">
                                             </div>
                                             <div class="col-md-2">
                                                  <label class="form-label small">Date de fin</label>
                                                  <input type="date" id="sh-date-end" class="form-control">
                                             </div>
                                             <div class="col-md-2">
                                                  <label class="form-label small">Article (EAN)</label>
                                                  <input type="text" id="sh-ean" class="form-control" placeholder="Optionnel">
                                             </div>
                                             <div class="col-md-2">
                                                  <button type="button" id="sh-search" class="btn btn-primary w-100">Rechercher</button>
                                             </div>
                                        </div>
                                        <div id="sh-coverage" class="small text-muted mt-2"></div>
                                        <div class="form-check form-switch mt-2">
                                             <input class="form-check-input" type="checkbox" role="switch" id="sh-group-by-department">
                                             <label class="form-check-label small" for="sh-group-by-department">Grouper par rayon (résolu depuis RPOS, peut prendre quelques secondes sur la première page)</label>
                                        </div>
                                   </div>
                              </div>
                         </div>
                    </div>

                    <div class="card mb-3">
                         <div class="card-body py-2">
                              <div class="sh-metric-row">
                                   <div class="sh-metric-row-item">
                                        <p class="sh-metric-label">Lignes trouvées</p>
                                        <p class="sh-metric-value" id="sh-stat-count">—</p>
                                   </div>
                                   <div class="sh-metric-row-item">
                                        <p class="sh-metric-label">Quantité totale</p>
                                        <p class="sh-metric-value" id="sh-stat-qty">—</p>
                                   </div>
                                   <div class="sh-metric-row-item">
                                        <p class="sh-metric-label">Chiffre d'affaires (HT)</p>
                                        <p class="sh-metric-value" id="sh-stat-revenue">—</p>
                                   </div>
                                   <div class="sh-metric-row-item">
                                        <p class="sh-metric-label">Chiffre d'affaires (TTC)</p>
                                        <p class="sh-metric-value" id="sh-stat-revenue-ttc">—</p>
                                   </div>
                              </div>
                         </div>
                    </div>

                    <div class="card">
                         <div class="card-header d-flex justify-content-between align-items-center">
                              <h4 class="card-title mb-0">Ventes synchronisées</h4>
                              <div class="d-flex align-items-center gap-2">
                                   <button type="button" class="btn btn-sm btn-outline-dark" id="sh-export-csv" title="Export CSV, ouvrable directement dans Excel">
                                        <iconify-icon icon="solar:file-download-bold-duotone" class="align-middle"></iconify-icon> Exporter (CSV)
                                   </button>
                                   <button type="button" class="btn btn-sm btn-outline-secondary" id="sh-prev-page" disabled>&laquo; Précédent</button>
                                   <span class="small text-muted" id="sh-page-label">—</span>
                                   <button type="button" class="btn btn-sm btn-outline-secondary" id="sh-next-page" disabled>Suivant &raquo;</button>
                              </div>
                         </div>
                         <div class="card-body p-0">
                              <div id="sh-empty-message" class="text-center text-muted py-4">Sélectionnez un magasin pour afficher ses ventes.</div>
                              <div id="sh-grid" style="display:none;"></div>
                         </div>
                    </div>

                    <script>
                         (function () {
                              const shopSelect = document.getElementById('sh-shop');
                              const emptyMessage = document.getElementById('sh-empty-message');
                              const gridDiv = document.getElementById('sh-grid');
                              let currentPage = 1;
                              const pageSize = 100;
                              let lastTotal = 0;

                              function setEmptyMessage(msg) {
                                   gridDiv.style.display = 'none';
                                   emptyMessage.style.display = '';
                                   emptyMessage.textContent = msg;
                              }

                              function showGrid() {
                                   emptyMessage.style.display = 'none';
                                   gridDiv.style.display = '';
                              }

                              // Regroupement "par rayon" (case à cocher) : rowGroup + groupDisplayType: 'groupRows'
                              // (essayé le 21/09/2026) ne fonctionne PAS avec AG Grid Community — vérifié dans le
                              // bundle CDN chargé ici, RowGroupingModule n'y existe pas du tout (seul
                              // ClientSideRowModelModule est présent) : le regroupement visuel de lignes fait
                              // partie d'AG Grid Enterprise (licence payante), pas Community, contrairement à ce
                              // qu'un commentaire précédent supposait — la case cochée ne faisait alors
                              // silencieusement rien, sans erreur console. Remplacé par une ligne d'en-tête de
                              // groupe "faite main" (pleine largeur, via isFullWidthRow/fullWidthCellRenderer,
                              // une fonctionnalité réellement Community) insérée avant chaque rayon dans des
                              // données triées par rayon puis par date — visuellement équivalent, sans
                              // dépendre d'Enterprise.
                              let groupByDepartmentActive = false;

                              const numberFormatter = function (params) {
                                   return (params.value === null || params.value === undefined) ? '—' : params.value.toLocaleString('fr-FR');
                              };
                              const currencyFormatter = function (params) {
                                   return (params.value === null || params.value === undefined) ? '—' : params.value.toLocaleString('fr-FR') + ' CFA';
                              };

                              const baseColumnDefs = [
                                   { field: 'dateLabel', headerName: 'Date', filter: 'agTextColumnFilter', sortable: true, sort: 'desc', minWidth: 170 },
                                   { field: 'ean', headerName: 'EAN', filter: 'agTextColumnFilter', sortable: true, minWidth: 140 },
                                   { field: 'label', headerName: 'Article', filter: 'agTextColumnFilter', sortable: true, flex: 1, minWidth: 220,
                                        valueFormatter: function (params) { return params.value || '—'; } },
                                   { field: 'quantity', headerName: 'Quantité', filter: 'agNumberColumnFilter', sortable: true, minWidth: 130, type: 'rightAligned', valueFormatter: numberFormatter },
                                   { field: 'revenueExclTax', headerName: 'CA (HT)', filter: 'agNumberColumnFilter', sortable: true, minWidth: 140, type: 'rightAligned', valueFormatter: currencyFormatter },
                                   { field: 'revenueInclTax', headerName: 'CA (TTC)', filter: 'agNumberColumnFilter', sortable: true, minWidth: 140, type: 'rightAligned', valueFormatter: currencyFormatter },
                              ];

                              const departmentColumnDef = {
                                   field: 'department', headerName: 'Rayon', filter: 'agTextColumnFilter', sortable: true, minWidth: 160,
                              };

                              // Construit une ligne d'en-tête de groupe pleine largeur "RAYON X (N article(s))",
                              // insérée avant chaque changement de rayon dans des lignes déjà triées par rayon.
                              function groupHeaderRow(department, count) {
                                   return { __groupHeader: true, department: department || 'Rayon inconnu', count: count };
                              }

                              // Trie les lignes par rayon (alphabétique) puis par date décroissante à l'intérieur
                              // de chaque rayon, et intercale une ligne d'en-tête de groupe avant chaque rayon.
                              function withDepartmentGroupHeaders(rows) {
                                   const sorted = rows.slice().sort(function (a, b) {
                                        const da = a.department || 'Rayon inconnu';
                                        const db = b.department || 'Rayon inconnu';
                                        if (da !== db) return da.localeCompare(db);
                                        return new Date(b.date) - new Date(a.date);
                                   });
                                   const out = [];
                                   let currentDept = null;
                                   let deptStartIdx = 0;
                                   sorted.forEach(function (row, idx) {
                                        const dept = row.department || 'Rayon inconnu';
                                        if (dept !== currentDept) {
                                             currentDept = dept;
                                             deptStartIdx = out.length;
                                             out.push(groupHeaderRow(dept, 0)); // count posé après coup (voir plus bas)
                                        }
                                        out.push(row);
                                   });
                                   // Deuxième passe : remplit le compte d'articles de chaque en-tête, non connu tant
                                   // que le groupe suivant n'a pas commencé lors de la première passe.
                                   let i = 0;
                                   while (i < out.length) {
                                        if (out[i].__groupHeader) {
                                             let count = 0;
                                             let j = i + 1;
                                             while (j < out.length && !out[j].__groupHeader) { count++; j++; }
                                             out[i].count = count;
                                             i = j;
                                        } else {
                                             i++;
                                        }
                                   }
                                   return out;
                              }

                              let gridApi = null;

                              function buildGridOptions(withDepartment) {
                                   // En mode groupé, le tri par défaut "Date desc" de baseColumnDefs (colonne
                                   // dateLabel) écraserait sinon visuellement l'ordre par rayon imposé dans
                                   // withDepartmentGroupHeaders : AG Grid retrie côté client selon l'état de tri de
                                   // la colonne, indépendamment de l'ordre des données injectées via setGridOption.
                                   // Retiré explicitement (sort: null) uniquement dans ce mode — l'utilisateur peut
                                   // toujours cliquer sur l'en-tête Date pour trier manuellement s'il le souhaite,
                                   // ce qui casse alors le regroupement visuel par rayon (attendu, comme n'importe
                                   // quel tri manuel dans un tableau groupé).
                                   const dateColDef = withDepartment
                                        ? Object.assign({}, baseColumnDefs[0], { sort: null })
                                        : baseColumnDefs[0];
                                   const columnDefs = withDepartment
                                        ? [departmentColumnDef, dateColDef].concat(baseColumnDefs.slice(1))
                                        : baseColumnDefs.slice();
                                   return {
                                        theme: window.REASSORT_AG_GRID_THEME_SOFT,
                                        columnDefs: columnDefs,
                                        localeText: window.AG_GRID_LOCALE_FR,
                                        domLayout: 'autoHeight',
                                        pagination: false,
                                        rowData: [],
                                        defaultColDef: { resizable: true, sortable: true },
                                        // Ligne pleine largeur (Community, contrairement au rowGrouping natif) pour les
                                        // en-têtes de groupe par rayon — cf. commentaire sur groupByDepartmentActive.
                                        isFullWidthRow: withDepartment ? function (params) { return !!params.rowNode.data.__groupHeader; } : undefined,
                                        fullWidthCellRenderer: withDepartment ? function (params) {
                                             const div = document.createElement('div');
                                             div.className = 'sh-group-header-row';
                                             div.textContent = params.data.department + ' (' + params.data.count + ' article(s))';
                                             return div;
                                        } : undefined,
                                        getRowHeight: withDepartment ? function (params) {
                                             return params.data && params.data.__groupHeader ? 38 : undefined;
                                        } : undefined,
                                   };
                              }

                              function destroyGrid() {
                                   if (gridApi) {
                                        gridApi.destroy();
                                        gridApi = null;
                                   }
                              }

                              function createGrid(withDepartment) {
                                   destroyGrid();
                                   gridDiv.innerHTML = '';
                                   const options = buildGridOptions(withDepartment);
                                   gridApi = agGrid.createGrid(gridDiv, options);
                              }

                              createGrid(false);

                              document.getElementById('sh-export-csv').addEventListener('click', function () {
                                   if (!gridApi) return;
                                   gridApi.exportDataAsCsv({ fileName: 'ventes-synchronisees.csv' });
                              });

                              async function loadShopList() {
                                   try {
                                        const res = await window.reassortFetch('/reassort/shops');
                                        const json = await res.json();
                                        if (!json.success) throw new Error(json.message);
                                        const byPos = {};
                                        json.data.forEach(function (s) {
                                             if (!byPos[s.posId]) byPos[s.posId] = [];
                                             byPos[s.posId].push(s);
                                        });
                                        shopSelect.innerHTML = Object.keys(byPos).sort().map(function (posId) {
                                             const shops = byPos[posId].slice().sort(function (a, b) { return (a.reference || '').localeCompare(b.reference || ''); });
                                             const options = shops.map(function (s) {
                                                  return '<option value="' + s.id + '" data-pos-id="' + s.posId + '">' + s.reference + ' - ' + s.name + '</option>';
                                             }).join('');
                                             return '<optgroup label="' + (shops[0].posLabel || posId) + '">' + options + '</optgroup>';
                                        }).join('');
                                        if (window.reassortMakeShopPickerSearchable) window.reassortMakeShopPickerSearchable(shopSelect);
                                   } catch (err) {
                                        shopSelect.innerHTML = '<option value="">Erreur: ' + err.message + '</option>';
                                   }
                              }

                              async function loadCoverage() {
                                   const box = document.getElementById('sh-coverage');
                                   const shopId = shopSelect.value;
                                   if (!shopId) { box.textContent = ''; return; }
                                   try {
                                        const res = await window.reassortFetch('/reassort/sales-lines/coverage?shopId=' + encodeURIComponent(shopId));
                                        const json = await res.json();
                                        if (!json.success) throw new Error(json.message);
                                        const d = json.data;
                                        box.textContent = d.count > 0
                                             ? 'Période couverte : ' + new Date(d.oldestDate).toLocaleDateString('fr-FR') + ' → ' + new Date(d.newestDate).toLocaleDateString('fr-FR') + ' (' + d.count.toLocaleString('fr-FR') + ' ligne(s) au total)'
                                             : 'Aucune vente synchronisée pour ce magasin. Utilisez Paramètres → Synchronisation des ventes pour lancer une récupération.';
                                   } catch (err) {
                                        box.textContent = '';
                                   }
                              }

                              function toRowData(l) {
                                   return {
                                        dateLabel: new Date(l.date).toLocaleString('fr-FR'),
                                        date: l.date,
                                        ean: l.ean,
                                        label: l.label,
                                        quantity: l.quantity,
                                        revenueExclTax: l.revenueExclTax,
                                        revenueInclTax: (l.revenueInclTax !== null && l.revenueInclTax !== undefined) ? l.revenueInclTax : null,
                                   };
                              }

                              // Le rayon n'existe pas sur SalesLine (une ligne de vente individuelle, pas un article
                              // catalogué) : on le résout à la demande via /sales-lines/departments, qui s'appuie sur le
                              // cache produit déjà alimenté par les générations de proposition passées sur ce magasin (donc
                              // rapide une fois "chaud"), avec repli RPOS pour les EAN encore inconnus. Ne regroupe que les
                              // lignes de la PAGE COURANTE (pas tout l'historique filtré) — cohérent avec la pagination déjà
                              // en place, un même article peut réapparaître sur d'autres pages.
                              async function renderGroupedByDepartment(lines) {
                                   const shopId = shopSelect.value;
                                   const posId = shopSelect.selectedOptions[0] ? shopSelect.selectedOptions[0].dataset.posId : null;
                                   const eans = [...new Set(lines.map(function (l) { return l.ean; }))];

                                   setEmptyMessage('Résolution des rayons (' + eans.length + ' article(s) distinct(s))...');
                                   let departmentByEan = {};
                                   try {
                                        const res = await window.reassortFetch('/reassort/sales-lines/departments?shopId=' + encodeURIComponent(shopId) + '&posId=' + encodeURIComponent(posId) + '&eans=' + encodeURIComponent(eans.join(',')));
                                        const json = await res.json();
                                        if (!json.success) throw new Error(json.message);
                                        departmentByEan = json.data;
                                   } catch (err) {
                                        setEmptyMessage('Erreur lors de la résolution des rayons: ' + err.message);
                                        return;
                                   }

                                   const rows = lines.map(function (l) {
                                        const row = toRowData(l);
                                        row.department = (departmentByEan[l.ean] && departmentByEan[l.ean].department) || 'Rayon inconnu';
                                        return row;
                                   });

                                   createGrid(true);
                                   gridApi.setGridOption('rowData', withDepartmentGroupHeaders(rows));
                                   showGrid();
                              }

                              let lastLoadedLines = [];
                              async function renderCurrentLines() {
                                   if (!lastLoadedLines.length) {
                                        setEmptyMessage('Aucune vente trouvée pour ces filtres.');
                                   } else if (document.getElementById('sh-group-by-department').checked) {
                                        groupByDepartmentActive = true;
                                        await renderGroupedByDepartment(lastLoadedLines);
                                   } else {
                                        groupByDepartmentActive = false;
                                        createGrid(false);
                                        gridApi.setGridOption('rowData', lastLoadedLines.map(toRowData));
                                        showGrid();
                                   }
                              }
                              document.getElementById('sh-group-by-department').addEventListener('change', renderCurrentLines);

                              // Jeton de requête : un changement rapide de magasin (ou de filtre) peut faire partir
                              // plusieurs recherches en parallèle dont les réponses reviennent dans le désordre —
                              // sans ce garde-fou, une réponse plus lente mais lancée pour un magasin déjà quitté
                              // pouvait écraser l'affichage après coup avec les données du mauvais magasin (bug
                              // observé le 15/09/2026 : changement de magasin, mais l'ancien magasin restait affiché).
                              let searchToken = 0;
                              async function search(page) {
                                   const shopId = shopSelect.value;
                                   if (!shopId) {
                                        setEmptyMessage('Sélectionnez un magasin pour afficher ses ventes.');
                                        return;
                                   }
                                   const token = ++searchToken;
                                   currentPage = page || 1;
                                   const dateStart = document.getElementById('sh-date-start').value;
                                   const dateEnd = document.getElementById('sh-date-end').value;
                                   const ean = document.getElementById('sh-ean').value.trim();

                                   const params = new URLSearchParams({ shopId, page: currentPage, pageSize });
                                   if (dateStart) params.set('dateStart', dateStart);
                                   if (dateEnd) params.set('dateEnd', dateEnd + 'T23:59:59');
                                   if (ean) params.set('ean', ean);

                                   setEmptyMessage('Chargement...');
                                   try {
                                        const res = await window.reassortFetch('/reassort/sales-lines?' + params.toString());
                                        const json = await res.json();
                                        if (token !== searchToken) return; // une recherche plus récente a déjà démarré, on ignore cette réponse tardive
                                        if (!json.success) throw new Error(json.message);
                                        const d = json.data;
                                        lastTotal = d.total;

                                        document.getElementById('sh-stat-count').textContent = d.total.toLocaleString('fr-FR');
                                        document.getElementById('sh-stat-qty').textContent = d.totalQuantity.toLocaleString('fr-FR');
                                        document.getElementById('sh-stat-revenue').textContent = d.totalRevenue.toLocaleString('fr-FR') + ' CFA';
                                        document.getElementById('sh-stat-revenue-ttc').textContent = (d.totalRevenueInclTax !== null && d.totalRevenueInclTax !== undefined)
                                             ? d.totalRevenueInclTax.toLocaleString('fr-FR') + ' CFA'
                                             : '— (données antérieures à l\'ajout du TTC)';

                                        lastLoadedLines = d.lines;
                                        await renderCurrentLines();
                                        if (token !== searchToken) return;

                                        const totalPages = Math.max(1, Math.ceil(d.total / pageSize));
                                        document.getElementById('sh-page-label').textContent = 'Page ' + currentPage + ' / ' + totalPages;
                                        document.getElementById('sh-prev-page').disabled = currentPage <= 1;
                                        document.getElementById('sh-next-page').disabled = currentPage >= totalPages;
                                   } catch (err) {
                                        if (token !== searchToken) return;
                                        setEmptyMessage('Erreur: ' + err.message);
                                   }
                              }

                              document.getElementById('sh-search').addEventListener('click', function () { search(1); });

                              document.getElementById('sh-prev-page').addEventListener('click', function () { if (currentPage > 1) search(currentPage - 1); });
                              document.getElementById('sh-next-page').addEventListener('click', function () { search(currentPage + 1); });
                              shopSelect.addEventListener('change', function () { loadCoverage(); search(1); });

                              // reassortMakeShopPickerSearchable (appelé dans loadShopList) synchronise shopSelect.value
                              // avec le magasin actif global de la topbar (demande du 21/09/2026 : "il affiche les
                              // ventes... ou tout est mélangé" — un compte ADMIN/SUPERVISOR voyait par défaut le PREMIER
                              // magasin de la liste, ex: "313", jamais forcément son magasin de travail actuel). Cette
                              // synchronisation est TOUJOURS terminée de façon synchrone au moment où .then() s'exécute
                              // ci-dessous (que le magasin global ait changé la valeur ou non) : on peut donc toujours se
                              // fier à shopSelect.value ici, sans dépendre d'un événement "change" qui ne se déclenche
                              // pas si le premier magasin de la liste coïncidait déjà avec le magasin global.
                              loadShopList().then(function () {
                                   if (shopSelect.options.length && shopSelect.value) { loadCoverage(); search(1); }
                              });
                         })();
                    </script>
