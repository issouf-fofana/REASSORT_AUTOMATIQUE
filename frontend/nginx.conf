server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Import de fichiers d'export de ventes (Paramètres > Fichiers de ventes) : un export RPOS réel
    # peut peser plusieurs centaines de Mo selon la période couverte, une taille qui varie au cas par
    # cas sans plafond prévisible (bug trouvé le 17/09/2026 : un fichier de 160 Mo échouait déjà avec
    # "File too large" contre la limite par défaut de nginx, 1 Mo — et l'utilisateur a confirmé avoir
    # régulièrement des fichiers dépassant 300 Mo). 0 = pas de limite côté nginx, plutôt que de fixer
    # un plafond arbitraire qui échouerait de la même façon au prochain fichier plus gros — aligné
    # avec salesFileUpload (multer) dans backend/src/routes/reassort/config.js, également sans limite.
    client_max_body_size 0;

    # Cas particuliers, à traiter AVANT la règle générique ~ \.html$ ci-dessous (location = est de
    # toute façon prioritaire sur location ~ dans nginx, mais on les regroupe ici pour la lisibilité) :
    # - index.html est la racine du site, son URL propre est / (pas /index).
    # - auth-signin.html est nommé /login (nom d'usage), pas /auth-signin (nom historique du fichier,
    #   hérité du template Volt/Larkon) — alias dédié plutôt que de renommer le fichier, ce qui
    #   casserait tout lien externe déjà distribué vers ce nom de fichier.
    # $request_uri (l'URL demandée par le client) plutôt que $uri : quand nginx sert / en interne
    # via `index index.html` ci-dessus, il déclenche une sous-requête interne vers index.html qui
    # matcherait aussi cette location — sans cette condition, / redirigeait en boucle vers lui-même
    # (redirect 301 déclenché par sa propre requête interne).
    location = /index.html {
        if ($request_uri = /index.html) {
            return 301 /;
        }
    }

    # Tableau de bord migré vers la SPA unifiée (12/10/2026, vague 5 du plan de migration) : sert le
    # bundle du shell (app-assets) à la place de l'ancien tableau-de-bord-app isolé. index
    # index.html; (racine du server{}) s'applique aussi à `location = /` : avec `alias`, nginx
    # réapplique alors la directive `index` sur le chemin déjà résolu, donnant
    # ".../index.htmlindex.html" (fichier inexistant, 500) — comportement documenté de nginx pour
    # alias + index sur une location exacte (`index "";` est syntaxiquement invalide, testé ;
    # régression reproduite une seconde fois le 12/10/2026 en généralisant par erreur le patron
    # `alias` utilisé par les autres routes migrées à cette route précise, malgré ce commentaire).
    # Servi via `root` + `try_files` sur un chemin LITTÉRAL à la place (même patron que /login) :
    # try_files ne déclenche jamais la directive `index`, seulement en dernier recours si aucun
    # argument ne correspond (jamais atteint ici, un seul chemin fixe est donné).
    location = / {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        root /usr/share/nginx/html/app-assets;
        try_files /index.html =404;
    }

    # Migrée vers React (25/09/2026, style "carte animée + formulaire" demandé par l'utilisateur) :
    # remplace l'ancien auth-signin.html (renommé auth-signin.old.html, conservé pour rollback).
    # Même patron try_files/root que / (Tableau de bord) plus haut — alias+index donnerait le même
    # bug ".../index.htmlindex.html" documenté ailleurs dans ce fichier.
    location = /login {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        alias /usr/share/nginx/html/app-assets/index.html;
    }
    location = /auth-signin {
        return 301 /login;
    }
    location = /auth-signin.html {
        return 301 /login;
    }

    # Page Paramètres migrée vers React (23/09/2026, migration progressive page par page — voir
    # /home/youssef/.claude/plans/compressed-roaming-orbit.md) : sert le bundle Vite au lieu de
    # l'ancien settings.html (renommé settings.old.html, conservé pour rollback). Placée AVANT la
    # règle générique ^/(.+)\.html$ ci-dessous : /settings ne correspond à aucun .html réel, donc
    # sans cette location dédiée la requête tomberait dans la règle catch-all (location /) qui
    # chercherait settings.html en vain (404) puisqu'il n'existe plus sous ce nom.
    # default_type forcé explicitement : nginx détermine le Content-Type par l'extension de l'URL
    # DEMANDÉE (types { } ne s'applique qu'aux fichiers servis via try_files/root sur leur propre
    # nom), pas par le fichier réel visé par `alias` — sans cette ligne, /settings (aucune extension
    # dans l'URL) partait avec application/octet-stream, poussant le navigateur à TÉLÉCHARGER la
    # page au lieu de l'afficher (bug trouvé le 23/09/2026, confirmé via `curl -I` et un navigateur
    # headless qui déclenchait un download plutôt qu'un rendu).
    location = /settings {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        alias /usr/share/nginx/html/app-assets/index.html;
    }

    # Ventes synchronisées migrée vers React (troisième page migrée) : même raisonnement que
    # /settings ci-dessus.
    location = /sales-history {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        alias /usr/share/nginx/html/app-assets/index.html;
    }

    # IA & Prédictions migrée vers React (quatrième page migrée) : même raisonnement que les autres
    # pages migrées ci-dessus.
    location = /ai-predictions {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        alias /usr/share/nginx/html/app-assets/index.html;
    }

    # Assistant IA migrée vers React (cinquième page migrée) : même raisonnement que les autres
    # pages migrées ci-dessus.
    location = /ai-assistant {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        alias /usr/share/nginx/html/app-assets/index.html;
    }

    # Mon accès — troisième page de la vague 1 basculée vers la SPA unifiée (12/10/2026). L'ancien
    # dossier ai-guide-app/ reste en place pour un rollback rapide, pas supprimé à cette étape.
    location = /ai-guide {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        alias /usr/share/nginx/html/app-assets/index.html;
    }

    # Qualité & IA migrée vers React (septième page migrée, fusion de 5 onglets) : même
    # raisonnement que les autres pages migrées ci-dessus.
    location = /ai-quality {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        alias /usr/share/nginx/html/app-assets/index.html;
    }

    # Utilisateurs migrée vers React (huitième page migrée) : même raisonnement que les autres
    # pages migrées ci-dessus.
    location = /users-list {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        alias /usr/share/nginx/html/app-assets/index.html;
    }

    # Guide du projet migrée vers React (neuvième page migrée) : même raisonnement que les autres
    # pages migrées ci-dessus.
    # Guide du projet — DEUXIÈME page basculée vers la SPA unifiée (vague 1, 12/10/2026). L'ancien
    # dossier project-guide-app/ (stage Dockerfile react-app-project-guide) reste en place pour un
    # rollback rapide, pas supprimé à cette étape.
    location = /project-guide {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        alias /usr/share/nginx/html/app-assets/index.html;
    }

    # Guide d'utilisation — PREMIÈRE page réellement basculée vers la SPA unifiée (cf. plan de
    # migration /home/youssef/.claude/plans/pure-singing-willow.md, point 8, 12/10/2026), après
    # validation complète des 7 critères sur l'ancienne route temporaire /user-guide-next (retirée).
    # L'ancien dossier user-guide-app/ (stage react-app-user-guide du Dockerfile) reste en place
    # pour un rollback rapide si besoin (cf. plan, section "Rollback") — pas supprimé à cette étape.
    location = /user-guide {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        alias /usr/share/nginx/html/app-assets/index.html;
    }
    location ^~ /app-assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Historique des commandes migrée vers React (dixième page migrée) : même raisonnement que les
    # autres pages migrées ci-dessus.
    location = /purchase-list {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        alias /usr/share/nginx/html/app-assets/index.html;
    }

    # Consommation de tokens, extraite de l'onglet Config IA des Paramètres (09/10/2026, demande
    # explicite : "mettre cette partie à part, supprimer de l'autre côté") — page dédiée en
    # disposition de widgets, même raisonnement que les autres pages migrées ci-dessus.
    location = /token-usage {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        alias /usr/share/nginx/html/app-assets/index.html;
    }

    # Proposition de commande migrée vers React (24/09/2026) : dernière page du site à basculer,
    # validée en conditions réelles (génération, envoi RPOS, historique de la semaine, analytics)
    # avant bascule. purchase-order.html devient purchase-order.old.html (même pattern que les 10
    # autres pages migrées), conservé sur disque pour rollback rapide, jamais lié depuis la sidebar.
    location = /purchase-order {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        alias /usr/share/nginx/html/app-assets/index.html;
    }

    # Mémoire du modèle migrée vers React (24/09/2026) : ai-mastery.html devient
    # ai-mastery.old.html (même pattern que les autres pages migrées).
    location = /ai-mastery {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        alias /usr/share/nginx/html/app-assets/index.html;
    }

    # Anomalies de commande migrée vers React (24/09/2026) : dernière page du site encore en HTML
    # classique — order-anomalies.html devient order-anomalies.old.html (même pattern que les autres
    # pages migrées). Migration complète du site vers React à partir de cette bascule.
    location = /order-anomalies {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        alias /usr/share/nginx/html/app-assets/index.html;
    }

    # Module Ruptures (16/10/2026) : nouvelle page dédiée, détection/diagnostic des épisodes de
    # rupture de stock sans données Cyrus (cf. rupture.md) — même raisonnement que les autres pages
    # migrées ci-dessus.
    location = /stockouts {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        alias /usr/share/nginx/html/app-assets/index.html;
    }

    # Page Surstock (21/10/2026) : même raisonnement que les autres pages SPA ci-dessus — sans ce
    # bloc, une visite directe ou un rechargement (F5) sur /overstock-report retombe sur la règle
    # générique `location /` tout en bas (try_files $uri $uri.html $uri/ =404), qui ne connaît pas
    # cette route côté serveur et répond 404 (bug trouvé le 21/10/2026 : "la vue de surstock ne
    # s'afficha" — la page ne fonctionnait qu'en navigation interne depuis une autre page déjà
    # chargée, jamais en accès direct).
    location = /overstock-report {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        alias /usr/share/nginx/html/app-assets/index.html;
    }

    # Page de détail d'une rupture (17/10/2026) : route dynamique /stockouts/episode/:id
    # (React Router côté client, pas de page serveur par id) — `location =` (match exact) ne
    # convient pas ici contrairement aux autres pages ci-dessus, d'où ce préfixe.
    # ATTENTION (bug déjà rencontré) : `alias` sur une location-PRÉFIXE (contrairement à une
    # location exacte comme /stockouts ci-dessus) réécrit le chemin en substituant le préfixe
    # matché puis en RECONCATÉNANT le reste de l'URI après la cible de l'alias — donnait
    # "index.htmlfake-id" (404) au lieu de servir index.html tel quel. `rewrite ... last` + un
    # second bloc en location exacte évite ce comportement.
    location ^~ /stockouts/episode/ {
        rewrite ^ /stockouts/episode/index.html last;
    }
    location = /stockouts/episode/index.html {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        alias /usr/share/nginx/html/app-assets/index.html;
    }

    # Page détail de la casse d'un article en surstock (21/10/2026) : route dynamique
    # /overstock-report/scrap/:ean — même raisonnement et même technique rewrite+location exacte
    # que /stockouts/episode/ ci-dessus (un `alias` direct sur une location-préfixe donnerait
    # "index.htmlfake-ean", 404).
    location ^~ /overstock-report/scrap/ {
        rewrite ^ /overstock-report/scrap/index.html last;
    }
    location = /overstock-report/scrap/index.html {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        alias /usr/share/nginx/html/app-assets/index.html;
    }

    # Résultat de l'analyse (05/10/2026) : nouvelle page, accessible à tout utilisateur authentifié
    # (pas réservée ADMIN) — permet au magasin de voir le détail d'une analyse de ventes volontaire
    # (article par article) sans déclencher de génération de proposition.
    location = /sales-analysis {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        alias /usr/share/nginx/html/app-assets/index.html;
    }

    # Demandes d'évolution — quatrième page de la vague 1 basculée vers la SPA unifiée (12/10/2026).
    # L'ancien dossier feature-requests-app/ reste en place pour un rollback rapide.
    location = /feature-requests {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        alias /usr/share/nginx/html/app-assets/index.html;
    }

    # Destinataires email — cinquième et dernière page de la vague 1 basculée vers la SPA unifiée
    # (12/10/2026). L'ancien dossier mail-recipients-app/ reste en place pour un rollback rapide.
    location = /mail-recipients {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        alias /usr/share/nginx/html/app-assets/index.html;
    }

    # URLs propres : /purchase-list sert purchase-list.html, sans jamais exposer l'extension
    # dans la barre d'adresse. Une visite directe sur le fichier .html est redirigée (301) vers la
    # forme sans extension, pour que les deux formes ne cohabitent jamais comme deux URLs distinctes
    # aux yeux des favoris/du SEO — et pour que la navigation converge naturellement vers l'URL
    # propre au fil des clics, sans avoir à réécrire les liens internes existants.
    # Exclut assets/partials/*.html : layout.js les charge en XHR synchrone (chemin relatif
    # "assets/partials/sidebar.html") pour injecter la sidebar/topbar sur chaque page — un 301 sur
    # cette requête interne fait échouer le XHR (xhr.status=301, ni 200 ni 0) et la sidebar
    # disparaît silencieusement sur toutes les pages. Ces fichiers ne sont jamais visités
    # directement par un utilisateur, donc pas besoin d'URL "propre" pour eux.
    location ~ ^/assets/partials/(.+)\.html$ {
        # Cache-Control manquant jusqu'ici (bug trouvé le 09/10/2026 : un nouveau lien sidebar
        # ajouté à sidebar.html restait invisible pour un navigateur qui avait déjà cette URL en
        # cache — même avec PARTIALS_VERSION incrémenté dans layout.js ET un rechargement forcé de
        # la page, car Chrome peut appliquer un cache heuristique (basé sur Last-Modified) à une
        # réponse XHR sans aucune directive Cache-Control explicite). Même traitement que les
        # fichiers JS/CSS juste en dessous : jamais de cache, PARTIALS_VERSION reste la seule
        # protection utile contre un ancien contenu affiché pendant une transition de déploiement.
        add_header Cache-Control "no-cache";
        try_files /assets/partials/$1.html =404;
    }
    location ~ ^/(.+)\.html$ {
        return 301 /$1$is_args$args;
    }

    # Les fichiers JS/CSS propres à l'application (assets/js/, assets/css/) n'ont pas de nom versionné
    # (pas de build avec hash de contenu dans ce projet, contrairement aux libs vendor/CDN) : sans
    # cette règle, un navigateur pouvait continuer à exécuter une version obsolète d'un script après
    # un déploiement, y compris après un rechargement simple de la page (F5) — observé concrètement
    # (un correctif déployé restait invisible tant que l'utilisateur ne forçait pas un rechargement
    # complet, Ctrl+Maj+R). no-cache force le navigateur à revalider auprès du serveur à chaque
    # chargement de page (pas "ne jamais mettre en cache" : un fichier inchangé renvoie un 304 léger,
    # pas un nouveau téléchargement complet) plutôt que de servir une copie locale sans vérifier.
    location ~ ^/assets/(js|css)/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Logo/favicon du site (demande du 28/09/2026 : "donne la possibilité de modifier le logo,
    # favicon sur mon ui") — interroge d'abord le backend (GET /api/site-logo, SystemConfig
    # SITE_LOGO_BASE64) pour servir un éventuel logo personnalisé ; si aucun n'a jamais été uploadé,
    # le backend répond 404 et error_page retombe ici sur le fichier statique d'origine (@fallback),
    # donc rien ne casse tant que ce réglage reste vide. resolver + variable dans proxy_pass : même
    # raisonnement que le proxy /api-backend/ plus bas (le nom du service backend doit être résolu à
    # chaque requête par le DNS interne Docker, pas figé au démarrage de nginx).
    location = /assets/images/logo-reassort.png {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream "__INTERNAL_BACKEND_HOST__:3001";
        proxy_intercept_errors on;
        error_page 404 = @site_logo_fallback;
        proxy_pass http://$backend_upstream/api/site-logo;
        add_header Cache-Control "no-cache";
    }
    location @site_logo_fallback {
        add_header Cache-Control "no-cache";
        try_files /assets/images/logo-reassort.png =404;
    }

    # Favicon du site, distinct du logo depuis le 09/10/2026 (demande explicite : "je veux mettre
    # deux logo different") — même mécanisme que le logo ci-dessus (proxy backend avec fallback sur
    # le fichier statique d'origine), mais sur sa propre image et son propre réglage SystemConfig
    # (SITE_FAVICON_BASE64), pour pouvoir changer l'un sans changer l'autre.
    location = /assets/images/favicon-reassort.png {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream "__INTERNAL_BACKEND_HOST__:3001";
        proxy_intercept_errors on;
        error_page 404 = @site_favicon_fallback;
        proxy_pass http://$backend_upstream/api/site-favicon;
        add_header Cache-Control "no-cache";
    }
    location @site_favicon_fallback {
        add_header Cache-Control "no-cache";
        try_files /assets/images/logo-reassort.png =404;
    }

    # Un seul nom de domaine pour tout (iareassort) : /api-backend/* est reverse-proxifié vers le
    # service backend (même réseau Docker Compose, résolu par le DNS interne Docker), pour ne pas
    # dépendre d'un deuxième sous-domaine (api.iareassort) à faire résoudre sur chaque poste client
    # tant qu'aucun DNS interne d'entreprise n'est en place. BACKEND_URL doit alors être défini
    # comme "http://<domaine-du-frontend>/api-backend" (voir docker-entrypoint.sh).
    # __INTERNAL_BACKEND_HOST__ est substitué par docker-entrypoint.sh (envsubst) : "app" sur
    # Dokploy (dokploy.yaml), "backend" en dev local (docker-compose.yml) — les deux fichiers
    # nomment ce service différemment. Sans cette substitution, nginx refuse de démarrer si le nom
    # codé en dur ne correspond à aucun service du réseau Docker courant ("host not found in
    # upstream"), ce qui a déjà cassé l'environnement de dev local une fois.
    # Endpoints SSE (Server-Sent Events) du backend — ai-analyze-article-stream,
    # ai-ask-followup-stream, chatbot/ask-stream — tous se terminent par "-stream". AVANT le bloc
    # générique /api-backend/ ci-dessous (une location ~ plus spécifique gagne sur un préfixe moins
    # spécifique dans l'ordre d'évaluation nginx — regex avant préfixe non exact ici, donc cet ordre
    # dans le fichier compte). Bug trouvé le 14/10/2026 ("il reste la et donne la reponse sans
    # montré les etape") : le bloc générique ci-dessous n'a jamais désactivé proxy_buffering, nginx
    # (buffering activé par défaut) accumulait donc toute la réponse SSE avant de la transmettre au
    # navigateur — le frontend recevait le texte d'un bloc à la fin au lieu du flux mot-à-mot déjà
    # implémenté côté backend (res.write par chunk) ET côté frontend (consumeSseStream). Même
    # symptôme sur les 2 autres endpoints -stream, jamais remarqué avant car moins utilisés/attendus
    # moins longtemps que les réponses du chatbot.
    location ~ ^/api-backend/.*-stream$ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream "__INTERNAL_BACKEND_HOST__:3001";
        rewrite ^/api-backend/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # Un flux SSE reste ouvert tant que la génération IA n'est pas terminée (plusieurs secondes à
        # quelques dizaines de secondes selon la réponse) — même raisonnement que proxy_read_timeout
        # déjà élevé sur le bloc générique pour l'import de fichiers volumineux, ici pour éviter
        # qu'une réponse IA un peu longue ne se fasse couper par un timeout nginx par défaut (60s).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api-backend/ {
        # resolver + variable dans proxy_pass (au lieu d'un upstream/hôte statique) : force nginx à
        # résoudre le nom via le DNS interne Docker (127.0.0.11) À CHAQUE REQUÊTE plutôt qu'une
        # seule fois au démarrage — sans ça, nginx refuse de démarrer si le conteneur cible n'est
        # pas encore prêt à cet instant précis ("host not found in upstream"), un ordre de
        # démarrage qu'on ne maîtrise pas complètement (Docker Compose ne garantit pas que le
        # backend écoute déjà sur son port au moment où le healthcheck "depends_on" le juge démarré).
        #
        # ATTENTION (bug déjà rencontré) : dès que proxy_pass cible une VARIABLE plutôt qu'un nom en
        # dur, nginx désactive silencieusement la réécriture normale du préfixe d'URL et transmet
        # systématiquement "/" au backend, quel que soit le chemin réel demandé (toute requête vers
        # /api-backend/quoi/que/ce/soit atterrissait sur "/" côté backend → 404 générique, y compris
        # sur les GET, symptôme : réponse HTML "Cannot GET /"/"Cannot PUT /" au lieu du JSON attendu).
        # $request_uri (chemin ORIGINAL demandé au proxy, jamais réécrit par nginx) réinjecté à la
        # main dans proxy_pass restaure ce que la réécriture automatique aurait dû faire.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream "__INTERNAL_BACKEND_HOST__:3001";
        rewrite ^/api-backend/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # L'intégration d'un fichier de ventes déjà déposé en base (sales-files-import-to-db) est
        # une requête HTTP synchrone qui peut dépasser le défaut nginx (60s) sur un gros fichier —
        # 81s mesurées pour 765 000 lignes le 18/09/2026, et rien ne plafonne la taille d'un futur
        # export. Solution temporaire en attendant une vraie version asynchrone (suivi par
        # runId/progression, comme la génération de proposition) : laisser largement plus de temps
        # plutôt que de couper la requête en cours d'exécution côté serveur (l'import continuerait
        # alors malgré tout côté backend, mais l'utilisateur verrait une fausse erreur de timeout).
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Toute autre route "propre" (/purchase-order, /settings, ...) sert le
    # fichier .html de même nom s'il existe, sinon retombe sur le comportement standard nginx
    # (fichier exact demandé, un dossier, puis 404) — couvre aussi bien / (index.html via `index`
    # ci-dessus) que les fichiers statiques réels (assets/, etc.) sans les faire passer par cette
    # règle inutilement.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
