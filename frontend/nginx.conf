server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cas particuliers, à traiter AVANT la règle générique ~ \.html$ ci-dessous (location = est de
    # toute façon prioritaire sur location ~ dans nginx, mais on les regroupe ici pour la lisibilité) :
    # - index.html est la racine du site, son URL propre est / (pas /index).
    # - auth-signin.html est nommé /login (nom d'usage), pas /auth-signin (nom historique du fichier,
    #   hérité du template Volt/Larkon) — alias dédié plutôt que de renommer le fichier, ce qui
    #   casserait tout lien externe déjà distribué vers ce nom de fichier.
    # $request_uri (l'URL demandée par le client) plutôt que $uri : quand nginx sert / en interne
    # via `index index.html` ci-dessus, il déclenche une sous-requête interne vers index.html qui
    # matcherait aussi cette location — sans cette condition, / redirigeait en boucle vers lui-même
    # (redirect 301 déclenché par sa propre requête interne).
    location = /index.html {
        if ($request_uri = /index.html) {
            return 301 /;
        }
    }
    location = /login {
        try_files /auth-signin.html =404;
    }
    location = /auth-signin {
        return 301 /login;
    }
    location = /auth-signin.html {
        return 301 /login;
    }

    # URLs propres : /admin-dashboard sert admin-dashboard.html, sans jamais exposer l'extension
    # dans la barre d'adresse. Une visite directe sur le fichier .html est redirigée (301) vers la
    # forme sans extension, pour que les deux formes ne cohabitent jamais comme deux URLs distinctes
    # aux yeux des favoris/du SEO — et pour que la navigation converge naturellement vers l'URL
    # propre au fil des clics, sans avoir à réécrire les liens internes existants.
    # Exclut assets/partials/*.html : layout.js les charge en XHR synchrone (chemin relatif
    # "assets/partials/sidebar.html") pour injecter la sidebar/topbar sur chaque page — un 301 sur
    # cette requête interne fait échouer le XHR (xhr.status=301, ni 200 ni 0) et la sidebar
    # disparaît silencieusement sur toutes les pages. Ces fichiers ne sont jamais visités
    # directement par un utilisateur, donc pas besoin d'URL "propre" pour eux.
    location ~ ^/assets/partials/(.+)\.html$ {
        try_files /assets/partials/$1.html =404;
    }
    location ~ ^/(.+)\.html$ {
        return 301 /$1$is_args$args;
    }

    # Les fichiers JS/CSS propres à l'application (assets/js/, assets/css/) n'ont pas de nom versionné
    # (pas de build avec hash de contenu dans ce projet, contrairement aux libs vendor/CDN) : sans
    # cette règle, un navigateur pouvait continuer à exécuter une version obsolète d'un script après
    # un déploiement, y compris après un rechargement simple de la page (F5) — observé concrètement
    # (un correctif déployé restait invisible tant que l'utilisateur ne forçait pas un rechargement
    # complet, Ctrl+Maj+R). no-cache force le navigateur à revalider auprès du serveur à chaque
    # chargement de page (pas "ne jamais mettre en cache" : un fichier inchangé renvoie un 304 léger,
    # pas un nouveau téléchargement complet) plutôt que de servir une copie locale sans vérifier.
    location ~ ^/assets/(js|css)/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Un seul nom de domaine pour tout (iareassort) : /api-backend/* est reverse-proxifié vers le
    # service backend "app" (même réseau Docker Compose, résolu par le DNS interne Docker), pour
    # ne pas dépendre d'un deuxième sous-domaine (api.iareassort) à faire résoudre sur chaque poste
    # client tant qu'aucun DNS interne d'entreprise n'est en place. BACKEND_URL doit alors être
    # défini comme "http://<domaine-du-frontend>/api-backend" (voir docker-entrypoint.sh).
    location /api-backend/ {
        proxy_pass http://app:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Toute autre route "propre" (/admin-dashboard, /purchase-order, /settings, ...) sert le
    # fichier .html de même nom s'il existe, sinon retombe sur le comportement standard nginx
    # (fichier exact demandé, un dossier, puis 404) — couvre aussi bien / (index.html via `index`
    # ci-dessus) que les fichiers statiques réels (assets/, etc.) sans les faire passer par cette
    # règle inutilement.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
