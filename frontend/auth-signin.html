<!DOCTYPE html>
<html lang="en" class="h-100">

<head>
     <!-- Title Meta -->
     <meta charset="utf-8" />
     <title>Sign In | Larkon - Responsive Admin Dashboard Template</title>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta name="description" content="A fully responsive premium admin dashboard template" />
     <meta name="author" content="Techzaa" />
     <meta http-equiv="X-UA-Compatible" content="IE=edge" />

     <!-- App favicon -->
     <link rel="shortcut icon" href="assets/images/favicon.ico">

     <!-- Vendor css (Require in all Page) -->
     <link href="assets/css/vendor.min.css" rel="stylesheet" type="text/css" />

     <!-- Icons css (Require in all Page) -->
     <link href="assets/css/icons.min.css" rel="stylesheet" type="text/css" />

     <!-- App css (Require in all Page) -->
     <link href="assets/css/app.min.css" rel="stylesheet" type="text/css" />

     <!-- Theme Config js (Require in all Page) -->
     <script src="assets/js/config.js"></script>
</head>

<body class="h-100">
     <div class="d-flex flex-column h-100 p-3">
          <div class="d-flex flex-column flex-grow-1">
               <div class="row h-100">
                    <div class="col-xxl-7">
                         <div class="row justify-content-center h-100">
                              <div class="col-lg-6 py-lg-5">
                                   <div class="d-flex flex-column h-100 justify-content-center">
                                        <div class="auth-logo mb-4">
                                             <a href="index.html" class="logo-dark">
                                                  <img src="assets/images/logo-dark.png" height="24" alt="logo dark">
                                             </a>

                                             <a href="index.html" class="logo-light">
                                                  <img src="assets/images/logo-light.png" height="24" alt="logo light">
                                             </a>
                                        </div>

                                        <h2 class="fw-bold fs-24">Connexion</h2>

                                        <p class="text-muted mt-1 mb-4">Réassort automatique — connectez-vous avec votre compte.</p>

                                        <div id="login-error" class="alert alert-danger" style="display:none;"></div>

                                        <div class="mb-5">
                                             <form id="login-form" class="authentication-form">
                                                  <div class="mb-3">
                                                       <label class="form-label" for="login-email">Email</label>
                                                       <input type="email" id="login-email" name="email" class="form-control" placeholder="Entrez votre email" required>
                                                  </div>
                                                  <div class="mb-3">
                                                       <label class="form-label" for="login-password">Mot de passe</label>
                                                       <input type="password" id="login-password" name="password" class="form-control" placeholder="Entrez votre mot de passe" required>
                                                  </div>

                                                  <div class="mb-1 text-center d-grid">
                                                       <button id="login-submit" class="btn btn-soft-primary" type="submit">Se connecter</button>
                                                  </div>
                                             </form>
                                             <script>
                                                  (function () {
                                                       const API_BASE = window.location.protocol + '//' + window.location.hostname + ':3001/api';
                                                       const form = document.getElementById('login-form');
                                                       const errorBox = document.getElementById('login-error');
                                                       const submitBtn = document.getElementById('login-submit');

                                                       // Déjà connecté -> direct au tableau de bord
                                                       if (localStorage.getItem('reassort_token')) {
                                                            window.location.href = 'index.html';
                                                       }

                                                       form.addEventListener('submit', async function (e) {
                                                            e.preventDefault();
                                                            errorBox.style.display = 'none';
                                                            submitBtn.disabled = true;

                                                            try {
                                                                 const res = await fetch(API_BASE + '/auth/login', {
                                                                      method: 'POST',
                                                                      headers: { 'Content-Type': 'application/json' },
                                                                      body: JSON.stringify({
                                                                           email: document.getElementById('login-email').value,
                                                                           password: document.getElementById('login-password').value,
                                                                      }),
                                                                 });
                                                                 const json = await res.json();
                                                                 if (!json.success) throw new Error(json.message);

                                                                 localStorage.setItem('reassort_token', json.data.token);
                                                                 localStorage.setItem('reassort_user', JSON.stringify(json.data.user));
                                                                 window.location.href = 'index.html';
                                                            } catch (err) {
                                                                 errorBox.textContent = err.message;
                                                                 errorBox.style.display = 'block';
                                                            } finally {
                                                                 submitBtn.disabled = false;
                                                            }
                                                       });
                                                  })();
                                             </script>
                                        </div>
                                   </div>
                              </div>
                         </div>
                    </div>

                    <div class="col-xxl-5 d-none d-xxl-flex">
                         <div class="card h-100 mb-0 overflow-hidden">
                              <div class="d-flex flex-column h-100">
                                   <img src="assets/images/small/img-10.jpg" alt="" class="w-100 h-100">
                              </div>
                         </div>
                    </div>
               </div>
          </div>
     </div>

     <!-- Vendor Javascript (Require in all Page) -->
     <script src="assets/js/vendor.js"></script>

     <!-- App Javascript (Require in all Page) -->
     <script src="assets/js/app.js"></script>

</body>
