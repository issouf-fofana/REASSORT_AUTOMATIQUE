<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/images/logo-reassort.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guide du projet | Réassort Automatique</title>

    <!-- Chemins ABSOLUS (pas relatifs à /project-guide-app/) : ces fichiers sont servis à la racine
         du site par le même conteneur nginx que les pages HTML classiques, jamais dupliqués ici. -->
    <link type="text/css" href="/assets/volt/css/volt.css" rel="stylesheet" />
    <link type="text/css" href="/assets/css/theme-override.css?v=2026-09-25-1" rel="stylesheet" />
    <!-- Pilote du 26/09/2026 : la sidebar Volt classique reste l'état par défaut (ÉTAT 1) — la barre
         "notch" (react-app-notch-nav) devient un DEUXIÈME état, affiché uniquement quand la sidebar
         est repliée par l'utilisateur (bouton burger), jamais les deux en même temps. Voir
         layout-collapsible.js pour la bascule entre les deux. -->
    <link type="text/css" href="/assets/css/notch-nav.css?v=2026-09-27-4" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1/dist/iconify-icon.min.js"></script>

    <!-- backend-config.js est généré au RUNTIME par docker-entrypoint.sh (pas au build Vite) — pas
         utilisé directement par cette page (aucun appel API, contenu 100% statique), mais chargé
         pour rester cohérent avec le reste du site et parce que reassort-auth.js en dépend. -->
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/backend-config.js"></script>
    <!-- reassort-auth.js/shop-picker.js DOIVENT être chargés avant layout.js/global-shop-selector.js
         (bug trouvé le 23/09/2026 sur les pages précédemment migrées). reassort-auth.js gère aussi
         la redirection vers /login si non connecté — nécessaire même sur cette page 100% statique. -->
    <script src="/assets/js/reassort-auth.js"></script>
    <script src="/assets/js/shop-picker.js"></script>
  </head>
  <body data-page-title="Guide du projet">
    <script src="/assets/js/loading-overlay.js"></script>

    <!-- ÉTAT 1 (par défaut) : sidebar/topbar Volt classiques, comme les 14 autres pages du site.
         ÉTAT 2 : remplacées par #notch-nav-slot (barre compacte), jamais les deux ensemble — la
         bascule et l'injection sont gérées par layout-collapsible.js. -->
    <div id="layout-sidebar-slot"></div>
    <div id="notch-nav-slot" style="display:none;"></div>
    <div id="pg-progress-bar"></div>
    <button type="button" id="reset-layout" class="visually-hidden" aria-hidden="true" tabindex="-1"></button>

    <main class="content">
      <div id="layout-topbar-slot"></div>
      <script src="/assets/js/layout-collapsible.js?v=2026-09-26-1"></script>
      <script src="/assets/js/notch-nav.js?v=2026-09-27-4"></script>
      <script src="/assets/js/global-shop-selector.js"></script>

      <div class="py-4">
        <div class="container-xxl">
          <div id="root"></div>
        </div>
      </div>
    </main>

    <script src="/assets/volt/vendor/@popperjs/core/dist/umd/popper.min.js"></script>
    <script src="/assets/volt/vendor/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="/assets/volt/vendor/simplebar/dist/simplebar.min.js"></script>
    <!-- Contenu statique du guide (gros objet de données, réutilisé tel quel plutôt que recopié en
         TypeScript — risque d'erreur de recopie pour aucun bénéfice, ce contenu n'est jamais
         manipulé par le composant React, seulement lu et rendu). -->
    <script src="/assets/js/project-guide-content.js"></script>
    <script src="/assets/js/notifications-bell.js"></script>
    <script src="/assets/js/ai-assistant-widget.js"></script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
