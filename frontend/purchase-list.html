<!DOCTYPE html>
<html lang="en">

<head>
     <!-- Title Meta -->
     <meta charset="utf-8" />
     <title>Historique des commandes | Réassort Automatique</title>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta http-equiv="X-UA-Compatible" content="IE=edge" />
     <link rel="icon" type="image/png" href="assets/images/logo-reassort.png">

     <!-- Volt Bootstrap 5 Dashboard (page pilote de migration) : CSS compilée depuis
          template-volt-src/ + template/volt-bootstrap-5-dashboard (gulp build:dev), copiée dans
          assets/volt/. Remplace entièrement vendor.min.css/icons.min.css/app.min.css (Larkon). -->
     <link type="text/css" href="assets/volt/css/volt.css" rel="stylesheet">
     <link type="text/css" href="assets/css/theme-override.css" rel="stylesheet">

     <!-- Iconify (icônes <iconify-icon> déjà utilisées partout dans cette page) : Larkon la fournissait
          via vendor.js, absent du build Volt. Chargée séparément pour ne pas réécrire ~30 icônes. -->
     <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1/dist/iconify-icon.min.js"></script>

     <!-- AG Grid Community (migration du tableau de cette page, même pattern que purchase-order-v2.html
          validé le 21/09/2026) : tri/filtre par colonne + export CSV, en JS vanilla. L'export .xlsx
          stylé fait partie d'AG Grid Enterprise (licence payante, pas configurée ici) — le CSV,
          gratuit avec la version Community, s'ouvre directement dans Excel avec les mêmes données. -->
     <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@33/dist/ag-grid-community.min.js"></script>
     <script src="assets/js/ag-grid-setup.js"></script>
     <script src="assets/js/ag-grid-locale-fr.js"></script>

     <!-- Theme Config js (Require in all Page) -->
     <script src="assets/js/config.js"></script>
    <script src="assets/js/backend-config.js"></script>
    <script src="assets/js/reassort-auth.js"></script>
    <script src="assets/js/shop-picker.js"></script>

    <style>
         .step-icon-wrap { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
         .step-icon-wrap iconify-icon { font-size: 20px; }
         .step-icon-wrap.state-active iconify-icon { animation: step-spin 1s linear infinite; }
         @keyframes step-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
         .validation-step { transition: background-color .3s ease, opacity .3s ease; opacity: .55; }
         .validation-step.state-active, .validation-step.state-done, .validation-step.state-error { opacity: 1; }
         .validation-step.state-active { background-color: rgba(35, 97, 206, .06); }
         /* Volt attend des libellés de menu courts (nowrap) ; les nôtres sont plus longs
            ("Proposition de commande"...) donc on autorise le retour à la ligne pour éviter
            le débordement horizontal du panneau latéral. */
         .sidebar .nav, .sidebar .multi-level .nav { white-space: normal; }

         /* Habillage AG Grid pour coller au thème du site (palette noir/blanc/gris stricte, aucun coin
            arrondi, police Inter). Migration vers la Theming API v33 (23/09/2026) :
            window.REASSORT_AG_GRID_THEME_SOFT (ag-grid-setup.js) fournit les mêmes couleurs en JS. */
         #orders-grid, #order-detail-grid {
              width: 100%;
         }

         /* Style "impeccable" (23/09/2026, même pattern que admin-dashboard.html/purchase-order.html) :
            rangée de métriques en filets fins au lieu du bandeau "X commande(s) au total" en petit
            texte gris — donne un vrai relevé synthétique en un coup d'œil avant de plonger dans le
            détail du tableau. Alerte rouge pâle réservée aux vrais seuils dépassés (taux d'annulation
            élevé), jamais de couleur décorative gratuite. */
         .po-metric-row {
              display: flex;
              flex-wrap: wrap;
              border-bottom: 1px solid var(--bs-border-color, #dee2e6);
         }
         .po-metric-row-item {
              flex: 1 1 160px;
              padding: 1rem 1.5rem 1rem 1.5rem;
              border-right: 1px solid var(--bs-border-color, #dee2e6);
         }
         .po-metric-row-item:last-child { border-right: none; }
         .po-metric-label {
              font-size: .8125rem;
              color: var(--bs-secondary-color, #6c757d);
              margin: 0 0 .35rem;
         }
         .po-metric-value {
              font-size: 1.5rem;
              font-weight: 600;
              line-height: 1.15;
              font-variant-numeric: tabular-nums;
              margin: 0;
         }
         .po-metric-value.is-alert { color: #B91C1C; }
         @media (max-width: 767px) {
              .po-metric-row-item { border-right: none; border-bottom: 1px solid var(--bs-border-color, #dee2e6); }
         }
    </style>
</head>

<body data-page-title="Historique des commandes">

     <script src="assets/js/loading-overlay.js"></script>

     <div id="layout-sidebar-slot"></div>

     <button type="button" id="reset-layout" class="visually-hidden" aria-hidden="true" tabindex="-1"></button>

     <main class="content">
          <div id="layout-topbar-slot"></div>
          <script src="assets/js/layout.js"></script>
          <script src="assets/js/global-shop-selector.js"></script>

          <div class="py-4">
               <div class="container-xxl">               <!-- Start Container Fluid -->
               <div class="container-xxl">

                    <div class="row">
                         <div class="col-xl-12">
                              <div class="card">
                                   <div class="d-flex card-header justify-content-between align-items-center">
                                        <div>
                                             <h4 class="card-title" id="orders-page-title">Historique des commandes fournisseur</h4>
                                        </div>
                                        <div class="d-flex gap-2 align-items-center">
                                             <select id="orders-shop-select" class="form-select form-select-sm" style="display:none; width: auto;"></select>
                                             <span id="orders-status" class="text-muted small"></span>
                                             <button id="orders-export-csv" class="btn btn-sm btn-outline-dark" title="Export CSV, ouvrable directement dans Excel">
                                                  <iconify-icon icon="solar:file-download-bold-duotone" class="align-middle"></iconify-icon> Exporter (CSV)
                                             </button>
                                             <button id="orders-refresh" class="btn btn-sm btn-outline-primary">Actualiser</button>
                                        </div>
                                   </div>
                                   <div class="po-metric-row" id="orders-metric-row" style="display:none;">
                                        <div class="po-metric-row-item">
                                             <p class="po-metric-label">Commandes affichées</p>
                                             <p class="po-metric-value" id="orders-metric-total">—</p>
                                        </div>
                                        <div class="po-metric-row-item">
                                             <p class="po-metric-label">Complètes</p>
                                             <p class="po-metric-value" id="orders-metric-complete">—</p>
                                        </div>
                                        <div class="po-metric-row-item">
                                             <p class="po-metric-label">En attente de livraison</p>
                                             <p class="po-metric-value" id="orders-metric-pending">—</p>
                                        </div>
                                        <div class="po-metric-row-item">
                                             <p class="po-metric-label">Annulées</p>
                                             <p class="po-metric-value" id="orders-metric-cancelled">—</p>
                                        </div>
                                   </div>
                                   <div class="card-body p-0">
                                        <div id="orders-grid" class="m-3"></div>
                                   </div>

                                   <div class="modal fade" id="order-detail-modal" tabindex="-1" aria-hidden="true">
                                        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
                                             <div class="modal-content">
                                                  <div class="modal-header">
                                                       <h5 class="modal-title" id="order-detail-title">Détail de la commande</h5>
                                                       <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                  </div>
                                                  <div class="modal-body">
                                                       <div id="order-detail-body">Chargement...</div>
                                                  </div>
                                                  <div class="modal-footer" id="order-detail-footer" style="display:none;">
                                                       <div id="order-detail-cancel-error" class="alert alert-danger py-2 px-3 mb-0 me-auto small" style="display:none;"></div>
                                                       <button type="button" id="order-detail-cancel-btn" class="btn btn-outline-danger btn-sm">Annuler cette commande sur RPOS</button>
                                                  </div>
                                             </div>
                                        </div>
                                   </div>

                                   <script>
                                        (function () {
                                             const currentUser = window.reassortGetUser();
                                             const status = document.getElementById('orders-status');
                                             const refreshBtn = document.getElementById('orders-refresh');
                                             const shopSelect = document.getElementById('orders-shop-select');

                                             function selectedShopId() {
                                                  if (!window.reassortIsSingleShopRole(currentUser.role)) return shopSelect.value || '';
                                                  return currentUser.rposShopId;
                                             }

                                             function selectedPosId() {
                                                  if (!window.reassortIsSingleShopRole(currentUser.role)) return shopSelect.selectedOptions.length ? shopSelect.selectedOptions[0].dataset.posId : '';
                                                  return currentUser.rposPosId;
                                             }

                                             function updateTitle() {
                                                  let shopName = currentUser.rposShopName;
                                                  let shopRef = currentUser.rposShopReference;
                                                  if (!window.reassortIsSingleShopRole(currentUser.role) && shopSelect.selectedOptions.length) {
                                                       shopName = shopSelect.selectedOptions[0].dataset.name;
                                                       shopRef = shopSelect.selectedOptions[0].dataset.reference;
                                                  }
                                                  document.getElementById('orders-page-title').textContent =
                                                       'Historique des commandes fournisseur' + (shopName ? ' — ' + shopRef + ' (' + shopName + ')' : '');
                                             }

                                             async function initShopPicker() {
                                                  if (!window.reassortIsSingleShopRole(currentUser.role)) {
                                                       shopSelect.style.display = '';
                                                       shopSelect.innerHTML = '<option value="">Chargement...</option>';
                                                       try {
                                                            const res = await window.reassortFetch('/reassort/shops');
                                                            const json = await res.json();
                                                            if (!json.success) throw new Error(json.message);
                                                            const byPos = {};
                                                            json.data.forEach(function (s) {
                                                                 if (!byPos[s.posId]) byPos[s.posId] = [];
                                                                 byPos[s.posId].push(s);
                                                            });
                                                            shopSelect.innerHTML = Object.keys(byPos).sort(function (a, b) { return parseInt(a.replace(/\D/g, ''), 10) - parseInt(b.replace(/\D/g, ''), 10); }).map(function (posId) {
                                                                 const shops = byPos[posId].slice().sort(function (a, b) { return (a.reference||'').localeCompare(b.reference||''); });
                                                                 const options = shops.map(function (s) {
                                                                      return '<option value="' + s.id + '" data-pos-id="' + s.posId + '" data-reference="' + s.reference + '" data-name="' + s.name + '">' + s.reference + ' - ' + s.name + '</option>';
                                                                 }).join('');
                                                                 return '<optgroup label="' + (shops[0].posLabel || posId) + '">' + options + '</optgroup>';
                                                            }).join('');
                                                            shopSelect.addEventListener('change', loadOrders);
                                                            window.reassortMakeShopPickerSearchable(shopSelect);
                                                       } catch (err) {
                                                            shopSelect.innerHTML = '<option value="">Erreur: ' + err.message + '</option>';
                                                       }
                                                  }
                                                  updateTitle();
                                             }

                                             const STATUS_BADGE = {
                                                  'en préparation': 'bg-secondary-subtle text-secondary',
                                                  'en attente de livraison': 'bg-warning-subtle text-warning',
                                                  'livrée partiellement': 'bg-info-subtle text-info',
                                                  'finalisée et partielle': 'bg-info-subtle text-info',
                                                  'complète': 'bg-success-subtle text-success',
                                                  'annulée': 'bg-danger-subtle text-danger',
                                             };

                                             function formatDate(iso) {
                                                  if (!iso) return '—';
                                                  const d = new Date(iso);
                                                  return d.toLocaleDateString('fr-FR') + (iso.includes('T') && !iso.endsWith('T00:00:00') ? ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '');
                                             }

                                             // Le rayon n'est pas un champ structuré côté RPOS (une commande fournisseur = un rayon,
                                                  // readme §11, mais l'API supplier_order ne renvoie que external_reference en texte libre) :
                                                  // on l'extrait de ce libellé ("Proposition réassort IA — LIQUIDES" -> "LIQUIDES") pour
                                                  // pouvoir grouper l'affichage, comme déjà fait sur purchase-order.html à partir des vraies
                                                  // données structurées (ProposalLine.department).
                                             function extractDepartment(externalReference) {
                                                  if (!externalReference) return 'Sans rayon identifié';
                                                  const marker = ' — ';
                                                  const idx = externalReference.indexOf(marker);
                                                  return idx === -1 ? externalReference : externalReference.slice(idx + marker.length);
                                             }

                                             // --- Grille AG Grid (remplace le tableau HTML + l'accordéon manuel par rayon, même pattern
                                             // que purchase-order-v2.html). Le "rayon" est regroupé nativement via rowGroup sur la
                                             // colonne dérivée _department (groupDefaultExpanded: 0 = replié par défaut, comme
                                             // l'ancien accordéon qui démarrait replié). ---
                                             function statusCellRenderer(params) {
                                                  const badgeClass = STATUS_BADGE[params.value] || 'bg-secondary-subtle text-secondary';
                                                  const span = document.createElement('span');
                                                  span.className = 'badge ' + badgeClass + ' py-1 px-2';
                                                  span.textContent = params.value;
                                                  return span;
                                             }

                                             function referenceCellRenderer(params) {
                                                  const btn = document.createElement('button');
                                                  btn.type = 'button';
                                                  btn.className = 'btn btn-sm btn-link p-0 fw-semibold order-open-btn';
                                                  btn.textContent = params.value;
                                                  btn.addEventListener('click', function () {
                                                       showOrderDetail(params.data.id, params.data.reference, params.data.status_display);
                                                  });
                                                  return btn;
                                             }

                                             const gridColumnDefs = [
                                                  { headerName: 'Rayon', field: '_department', rowGroup: true, hide: true, filter: 'agTextColumnFilter' },
                                                  { headerName: 'Référence', field: 'reference', filter: 'agTextColumnFilter', width: 150, cellRenderer: referenceCellRenderer },
                                                  { headerName: 'Libellé', field: 'external_reference', flex: 1.5, minWidth: 220, filter: 'agTextColumnFilter',
                                                       valueFormatter: function (p) { return p.value || '—'; } },
                                                  { headerName: 'Fournisseur', field: '_supplierLabel', flex: 1, minWidth: 180, filter: 'agTextColumnFilter' },
                                                  { headerName: 'Date commande', field: 'date', filter: 'agDateColumnFilter', width: 160,
                                                       valueFormatter: function (p) { return formatDate(p.value); } },
                                                  { headerName: 'Date livraison', field: 'delivery_date', filter: 'agDateColumnFilter', width: 160,
                                                       valueFormatter: function (p) { return formatDate(p.value); } },
                                                  { headerName: 'Statut', field: 'status_display', filter: 'agTextColumnFilter', width: 170, cellRenderer: statusCellRenderer },
                                                  { headerName: 'Créée par', field: 'created_by', filter: 'agTextColumnFilter', width: 150,
                                                       valueFormatter: function (p) { return p.value || '—'; } },
                                             ];

                                             let gridApi = null;
                                             let lastLoadedOrders = [];

                                             function ensureGrid() {
                                                  if (gridApi) return gridApi;
                                                  gridApi = agGrid.createGrid(document.getElementById('orders-grid'), {
                                                       theme: window.REASSORT_AG_GRID_THEME_SOFT,
                                                       columnDefs: gridColumnDefs,
                                                       rowData: [],
                                                       localeText: window.AG_GRID_LOCALE_FR,
                                                       domLayout: 'autoHeight',
                                                       animateRows: false,
                                                       suppressCellFocus: true,
                                                       groupDisplayType: 'groupRows',
                                                       groupDefaultExpanded: 0,
                                                       groupRowRendererParams: {
                                                            innerRenderer: function (params) {
                                                                 const count = params.node.allChildrenCount;
                                                                 return '<strong>' + params.value + '</strong> <span class="text-muted small">(' + count + ' commande(s))</span>';
                                                            },
                                                       },
                                                       getRowId: function (params) { return params.data.id; },
                                                       onRowDoubleClicked: function (e) {
                                                            if (!e.data) return;
                                                            showOrderDetail(e.data.id, e.data.reference, e.data.status_display);
                                                       },
                                                  });
                                                  return gridApi;
                                             }

                                             function renderRows(orders) {
                                                  ensureGrid();
                                                  const rows = orders.map(function (o) {
                                                       return Object.assign({}, o, {
                                                            _department: extractDepartment(o.external_reference),
                                                            _supplierLabel: o.supplier ? o.supplier.code + ' / ' + o.supplier.name : '—',
                                                       });
                                                  });
                                                  gridApi.setGridOption('rowData', rows);
                                             }

                                             // Relevé synthèse au-dessus du tableau (style "impeccable", 23/09/2026) : calculé côté client
                                             // à partir des commandes déjà chargées, sans appel réseau supplémentaire. status_display vient
                                             // directement de RPOS (mêmes clés que STATUS_BADGE ci-dessus) ; "complète" regroupe ici
                                             // 'complète' et 'finalisée et partielle' (statuts jugés équivalents pour ce relevé synthétique).
                                             function renderMetricRow(orders) {
                                                  const row = document.getElementById('orders-metric-row');
                                                  if (!orders.length) { row.style.display = 'none'; return; }
                                                  row.style.display = '';
                                                  const total = orders.length;
                                                  const complete = orders.filter(function (o) { return o.status_display === 'complète' || o.status_display === 'finalisée et partielle'; }).length;
                                                  const pending = orders.filter(function (o) { return o.status_display === 'en attente de livraison' || o.status_display === 'livrée partiellement'; }).length;
                                                  const cancelled = orders.filter(function (o) { return o.status_display === 'annulée'; }).length;
                                                  document.getElementById('orders-metric-total').textContent = total;
                                                  document.getElementById('orders-metric-complete').textContent = complete;
                                                  document.getElementById('orders-metric-pending').textContent = pending;
                                                  const cancelledEl = document.getElementById('orders-metric-cancelled');
                                                  cancelledEl.textContent = cancelled;
                                                  // Alerte visuelle uniquement si l'annulation dépasse 15% des commandes affichées (jugé, comme
                                                  // le seuil de surstock 10% sur Vue Globale) — jamais de rouge pour un simple "annulée" isolée.
                                                  cancelledEl.classList.toggle('is-alert', total > 0 && cancelled / total > 0.15);
                                             }

                                             document.getElementById('orders-export-csv').addEventListener('click', function () {
                                                  if (!gridApi) return;
                                                  const shopRef = (currentUser && currentUser.rposShopReference) || 'magasin';
                                                  gridApi.exportDataAsCsv({
                                                       fileName: 'commandes-fournisseur-' + shopRef + '-' + new Date().toISOString().slice(0, 10) + '.csv',
                                                  });
                                             });

                                             const orderDetailModalEl = document.getElementById('order-detail-modal');
                                             let orderDetailModal = null;
                                             function getOrderDetailModal() {
                                                  if (!orderDetailModal) orderDetailModal = new bootstrap.Modal(orderDetailModalEl);
                                                  return orderDetailModal;
                                             }

                                             async function showOrderDetail(orderId, reference, statusDisplay) {
                                                  document.getElementById('order-detail-title').textContent = 'Détail de la commande ' + reference;
                                                  const body = document.getElementById('order-detail-body');
                                                  body.innerHTML = 'Chargement...';
                                                  document.getElementById('order-detail-cancel-error').style.display = 'none';

                                                  const footer = document.getElementById('order-detail-footer');
                                                  const cancelBtn = document.getElementById('order-detail-cancel-btn');
                                                  const canCancel = currentUser.role === 'ADMIN' && statusDisplay !== 'annulée' && statusDisplay !== 'supprimée';
                                                  footer.style.display = canCancel ? '' : 'none';
                                                  if (canCancel) {
                                                       cancelBtn.disabled = false;
                                                       cancelBtn.textContent = 'Annuler cette commande sur RPOS';
                                                       cancelBtn.onclick = async function () {
                                                            if (!confirm('Annuler définitivement la commande ' + reference + ' sur RPOS ? Cette action est irréversible.')) return;
                                                            cancelBtn.disabled = true;
                                                            cancelBtn.textContent = 'Annulation en cours...';
                                                            try {
                                                                 const shopId = selectedShopId();
                                                                 const posId = selectedPosId();
                                                                 const res = await window.reassortFetch('/reassort/orders/' + encodeURIComponent(orderId) + '/cancel?shop=' + encodeURIComponent(shopId) + '&pos=' + encodeURIComponent(posId), { method: 'POST' });
                                                                 const json = await res.json();
                                                                 if (!json.success) throw new Error(json.message);
                                                                 getOrderDetailModal().hide();
                                                                 loadOrders();
                                                            } catch (err) {
                                                                 const errBox = document.getElementById('order-detail-cancel-error');
                                                                 errBox.textContent = 'Erreur: ' + err.message;
                                                                 errBox.style.display = 'block';
                                                                 cancelBtn.disabled = false;
                                                                 cancelBtn.textContent = 'Annuler cette commande sur RPOS';
                                                            }
                                                       };
                                                  }

                                                  getOrderDetailModal().show();
                                                  try {
                                                       const shopId = selectedShopId();
                                                       const res = await window.reassortFetch('/reassort/orders/' + encodeURIComponent(orderId) + '/detail?shop=' + encodeURIComponent(shopId));
                                                       const json = await res.json();
                                                       if (!json.success) throw new Error(json.message);
                                                       const proposal = json.data;
                                                       const lines = proposal.lines || [];
                                                       if (!lines.length) {
                                                            body.innerHTML = '<p class="text-muted mb-0">Aucun article trouvé pour cette commande.</p>';
                                                            return;
                                                       }
                                                       const total = lines.reduce(function (sum, l) {
                                                            return sum + (l.sellingPrice || 0) * (l.quantityValidated !== null && l.quantityValidated !== undefined ? l.quantityValidated : l.quantitySuggested);
                                                       }, 0);
                                                       body.innerHTML = '<div id="order-detail-grid" class="mb-2"></div>' +
                                                            '<p class="text-end fw-semibold mb-0 mt-2">Total envoyé : ' + total.toLocaleString('fr-FR') + ' CFA</p>';
                                                       const detailRows = lines.map(function (l) {
                                                            const qtySent = l.quantityValidated !== null && l.quantityValidated !== undefined ? l.quantityValidated : l.quantitySuggested;
                                                            return {
                                                                 ean: l.ean,
                                                                 label: l.label,
                                                                 quantitySuggested: l.quantitySuggested,
                                                                 qtySent: qtySent,
                                                                 sellingPrice: l.sellingPrice || 0,
                                                                 value: (l.sellingPrice || 0) * qtySent,
                                                            };
                                                       });
                                                       // Grille du détail recréée à chaque ouverture (le conteneur est réinjecté via
                                                       // body.innerHTML ci-dessus) plutôt que réutilisée comme la grille principale.
                                                       agGrid.createGrid(document.getElementById('order-detail-grid'), {
                                                            theme: window.REASSORT_AG_GRID_THEME_SOFT,
                                                            columnDefs: [
                                                                 { headerName: 'EAN', field: 'ean', filter: 'agTextColumnFilter', width: 130 },
                                                                 { headerName: 'Article', field: 'label', flex: 1, minWidth: 200, filter: 'agTextColumnFilter' },
                                                                 { headerName: 'Qté proposée', field: 'quantitySuggested', type: 'numericColumn', filter: 'agNumberColumnFilter', width: 130 },
                                                                 { headerName: 'Qté envoyée', field: 'qtySent', type: 'numericColumn', filter: 'agNumberColumnFilter', width: 130,
                                                                      cellClass: 'fw-semibold' },
                                                                 { headerName: 'Prix vente', field: 'sellingPrice', type: 'numericColumn', filter: 'agNumberColumnFilter', width: 130,
                                                                      valueFormatter: function (p) { return p.value ? p.value.toLocaleString('fr-FR') + ' CFA' : '—'; } },
                                                                 { headerName: 'Valeur', field: 'value', type: 'numericColumn', filter: 'agNumberColumnFilter', width: 130,
                                                                      valueFormatter: function (p) { return p.value.toLocaleString('fr-FR') + ' CFA'; } },
                                                            ],
                                                            rowData: detailRows,
                                                            localeText: window.AG_GRID_LOCALE_FR,
                                                            domLayout: 'autoHeight',
                                                            animateRows: false,
                                                            suppressCellFocus: true,
                                                       });
                                                  } catch (err) {
                                                       body.innerHTML = '<div class="alert alert-warning mb-0">' + err.message + '</div>';
                                                  }
                                             }

                                             // Jeton de requête : un changement rapide de magasin peut faire revenir les réponses dans
                                             // le désordre — sans ce garde-fou, la réponse d'un magasin déjà quitté pouvait écraser
                                             // l'affichage après coup (même bug que sales-history.html, corrigé le 15/09/2026).
                                             let ordersLoadToken = 0;
                                             async function loadOrders() {
                                                  updateTitle();
                                                  const shopId = selectedShopId();
                                                  if (!shopId) {
                                                       ensureGrid();
                                                       gridApi.setGridOption('rowData', []);
                                                       document.getElementById('orders-metric-row').style.display = 'none';
                                                       status.textContent = 'Sélectionnez un magasin.';
                                                       return;
                                                  }
                                                  const token = ++ordersLoadToken;
                                                  status.textContent = 'Chargement...';
                                                  refreshBtn.disabled = true;
                                                  try {
                                                       const posId = selectedPosId();
                                                       const res = await window.reassortFetch('/reassort/orders?shop=' + encodeURIComponent(shopId) + (posId ? '&pos=' + encodeURIComponent(posId) : ''));
                                                       const json = await res.json();
                                                       if (token !== ordersLoadToken) return;
                                                       if (!json.success) throw new Error(json.message);
                                                       lastLoadedOrders = json.data.orders;
                                                       renderRows(lastLoadedOrders);
                                                       renderMetricRow(lastLoadedOrders);
                                                       status.textContent = json.data.count + ' commande(s) au total';
                                                  } catch (err) {
                                                       if (token !== ordersLoadToken) return;
                                                       ensureGrid();
                                                       gridApi.setGridOption('rowData', []);
                                                       document.getElementById('orders-metric-row').style.display = 'none';
                                                       status.textContent = 'Erreur: ' + err.message;
                                                  } finally {
                                                       if (token === ordersLoadToken) refreshBtn.disabled = false;
                                                  }
                                             }

                                             refreshBtn.addEventListener('click', loadOrders);
                                             initShopPicker().then(loadOrders);
                                        })();
                                   </script>
                              </div>
                         </div>
     
                    </div>
