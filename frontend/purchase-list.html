<!DOCTYPE html>
<html lang="en">

<head>
     <!-- Title Meta -->
     <meta charset="utf-8" />
     <title>Historique des commandes | Réassort Automatique</title>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta http-equiv="X-UA-Compatible" content="IE=edge" />

     <!-- Volt Bootstrap 5 Dashboard (page pilote de migration) : CSS compilée depuis
          template-volt-src/ + template/volt-bootstrap-5-dashboard (gulp build:dev), copiée dans
          assets/volt/. Remplace entièrement vendor.min.css/icons.min.css/app.min.css (Larkon). -->
     <link type="text/css" href="assets/volt/css/volt.css" rel="stylesheet">

     <!-- Iconify (icônes <iconify-icon> déjà utilisées partout dans cette page) : Larkon la fournissait
          via vendor.js, absent du build Volt. Chargée séparément pour ne pas réécrire ~30 icônes. -->
     <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1/dist/iconify-icon.min.js"></script>

     <!-- Theme Config js (Require in all Page) -->
     <script src="assets/js/config.js"></script>
    <script src="assets/js/reassort-auth.js"></script>
    <script src="assets/js/shop-picker.js"></script>

    <style>
         .step-icon-wrap { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
         .step-icon-wrap iconify-icon { font-size: 20px; }
         .step-icon-wrap.state-active iconify-icon { animation: step-spin 1s linear infinite; }
         @keyframes step-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
         .validation-step { transition: background-color .3s ease, opacity .3s ease; opacity: .55; }
         .validation-step.state-active, .validation-step.state-done, .validation-step.state-error { opacity: 1; }
         .validation-step.state-active { background-color: rgba(35, 97, 206, .06); }
         /* Volt attend des libellés de menu courts (nowrap) ; les nôtres sont plus longs
            ("Proposition de commande"...) donc on autorise le retour à la ligne pour éviter
            le débordement horizontal du panneau latéral. */
         .sidebar .nav, .sidebar .multi-level .nav { white-space: normal; }
    </style>
</head>

<body data-page-title="Historique des commandes">

     <div id="layout-sidebar-slot"></div>

     <button type="button" id="reset-layout" class="visually-hidden" aria-hidden="true" tabindex="-1"></button>

     <main class="content">
          <div id="layout-topbar-slot"></div>
          <script src="assets/js/layout.js"></script>

          <div class="py-4">
               <div class="container-xxl">               <!-- Start Container Fluid -->
               <div class="container-xxl">

                    <div class="row">
                         <div class="col-xl-12">
                              <div class="card">
                                   <div class="d-flex card-header justify-content-between align-items-center">
                                        <div>
                                             <h4 class="card-title" id="orders-page-title">Historique des commandes fournisseur</h4>
                                        </div>
                                        <div class="d-flex gap-2 align-items-center">
                                             <select id="orders-shop-select" class="form-select form-select-sm" style="display:none; width: auto;"></select>
                                             <span id="orders-status" class="text-muted small"></span>
                                             <button id="orders-refresh" class="btn btn-sm btn-outline-primary">Actualiser</button>
                                        </div>
                                   </div>
                                   <div class="card-body p-0">
                                        <div class="table-responsive">
                                             <table class="table align-middle mb-0 table-hover table-centered">
                                                  <thead class="bg-light-subtle">
                                                       <tr>
                                                            <th>Référence</th>
                                                            <th>Libellé</th>
                                                            <th>Fournisseur</th>
                                                            <th>Date commande</th>
                                                            <th>Date livraison</th>
                                                            <th>Statut</th>
                                                            <th>Créée par</th>
                                                       </tr>
                                                  </thead>
                                                  <tbody id="orders-tbody">
                                                       <tr>
                                                            <td colspan="7" class="text-center text-muted py-4">Chargement...</td>
                                                       </tr>
                                                  </tbody>
                                             </table>
                                        </div>
                                        <!-- end table-responsive -->
                                   </div>

                                   <div class="modal fade" id="order-detail-modal" tabindex="-1" aria-hidden="true">
                                        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
                                             <div class="modal-content">
                                                  <div class="modal-header">
                                                       <h5 class="modal-title" id="order-detail-title">Détail de la commande</h5>
                                                       <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                  </div>
                                                  <div class="modal-body">
                                                       <div id="order-detail-body">Chargement...</div>
                                                  </div>
                                                  <div class="modal-footer" id="order-detail-footer" style="display:none;">
                                                       <div id="order-detail-cancel-error" class="alert alert-danger py-2 px-3 mb-0 me-auto small" style="display:none;"></div>
                                                       <button type="button" id="order-detail-cancel-btn" class="btn btn-outline-danger btn-sm">Annuler cette commande sur RPOS</button>
                                                  </div>
                                             </div>
                                        </div>
                                   </div>

                                   <script>
                                        (function () {
                                             const currentUser = window.reassortGetUser();
                                             const tbody = document.getElementById('orders-tbody');
                                             const status = document.getElementById('orders-status');
                                             const refreshBtn = document.getElementById('orders-refresh');
                                             const shopSelect = document.getElementById('orders-shop-select');

                                             function selectedShopId() {
                                                  if (currentUser.role !== 'STORE') return shopSelect.value || '';
                                                  return currentUser.rposShopId;
                                             }

                                             function selectedPosId() {
                                                  if (currentUser.role !== 'STORE') return shopSelect.selectedOptions.length ? shopSelect.selectedOptions[0].dataset.posId : '';
                                                  return currentUser.rposPosId;
                                             }

                                             function updateTitle() {
                                                  let shopName = currentUser.rposShopName;
                                                  let shopRef = currentUser.rposShopReference;
                                                  if (currentUser.role !== 'STORE' && shopSelect.selectedOptions.length) {
                                                       shopName = shopSelect.selectedOptions[0].dataset.name;
                                                       shopRef = shopSelect.selectedOptions[0].dataset.reference;
                                                  }
                                                  document.getElementById('orders-page-title').textContent =
                                                       'Historique des commandes fournisseur' + (shopName ? ' — ' + shopRef + ' (' + shopName + ')' : '');
                                             }

                                             async function initShopPicker() {
                                                  if (currentUser.role !== 'STORE') {
                                                       shopSelect.style.display = '';
                                                       shopSelect.innerHTML = '<option value="">Chargement...</option>';
                                                       try {
                                                            const res = await window.reassortFetch('/reassort/shops');
                                                            const json = await res.json();
                                                            if (!json.success) throw new Error(json.message);
                                                            const byPos = {};
                                                            json.data.forEach(function (s) {
                                                                 if (!byPos[s.posId]) byPos[s.posId] = [];
                                                                 byPos[s.posId].push(s);
                                                            });
                                                            shopSelect.innerHTML = Object.keys(byPos).sort(function (a, b) { return parseInt(a.replace(/\D/g, ''), 10) - parseInt(b.replace(/\D/g, ''), 10); }).map(function (posId) {
                                                                 const shops = byPos[posId].slice().sort(function (a, b) { return (a.reference||'').localeCompare(b.reference||''); });
                                                                 const options = shops.map(function (s) {
                                                                      return '<option value="' + s.id + '" data-pos-id="' + s.posId + '" data-reference="' + s.reference + '" data-name="' + s.name + '">' + s.reference + ' - ' + s.name + '</option>';
                                                                 }).join('');
                                                                 return '<optgroup label="' + (shops[0].posLabel || posId) + '">' + options + '</optgroup>';
                                                            }).join('');
                                                            shopSelect.addEventListener('change', loadOrders);
                                                            window.reassortMakeShopPickerSearchable(shopSelect);
                                                       } catch (err) {
                                                            shopSelect.innerHTML = '<option value="">Erreur: ' + err.message + '</option>';
                                                       }
                                                  }
                                                  updateTitle();
                                             }

                                             const STATUS_BADGE = {
                                                  'en préparation': 'bg-secondary-subtle text-secondary',
                                                  'en attente de livraison': 'bg-warning-subtle text-warning',
                                                  'livrée partiellement': 'bg-info-subtle text-info',
                                                  'finalisée et partielle': 'bg-info-subtle text-info',
                                                  'complète': 'bg-success-subtle text-success',
                                                  'annulée': 'bg-danger-subtle text-danger',
                                             };

                                             function formatDate(iso) {
                                                  if (!iso) return '—';
                                                  const d = new Date(iso);
                                                  return d.toLocaleDateString('fr-FR') + (iso.includes('T') && !iso.endsWith('T00:00:00') ? ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '');
                                             }

                                             function renderRows(orders) {
                                                  if (!orders.length) {
                                                       tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Aucune commande trouvée.</td></tr>';
                                                       return;
                                                  }
                                                  tbody.innerHTML = orders.map(function (o) {
                                                       const badgeClass = STATUS_BADGE[o.status_display] || 'bg-secondary-subtle text-secondary';
                                                       return '<tr class="cursor-pointer order-row" data-order-id="' + o.id + '" data-order-reference="' + o.reference + '" data-order-status="' + o.status_display + '" style="cursor:pointer;">' +
                                                            '<td><strong>' + o.reference + '</strong></td>' +
                                                            '<td>' + (o.external_reference || '—') + '</td>' +
                                                            '<td>' + (o.supplier ? o.supplier.code + ' / ' + o.supplier.name : '—') + '</td>' +
                                                            '<td>' + formatDate(o.date) + '</td>' +
                                                            '<td>' + formatDate(o.delivery_date) + '</td>' +
                                                            '<td><span class="badge ' + badgeClass + ' py-1 px-2">' + o.status_display + '</span></td>' +
                                                            '<td>' + (o.created_by || '—') + '</td>' +
                                                            '</tr>';
                                                  }).join('');
                                             }

                                             const orderDetailModalEl = document.getElementById('order-detail-modal');
                                             let orderDetailModal = null;
                                             function getOrderDetailModal() {
                                                  if (!orderDetailModal) orderDetailModal = new bootstrap.Modal(orderDetailModalEl);
                                                  return orderDetailModal;
                                             }

                                             async function showOrderDetail(orderId, reference, statusDisplay) {
                                                  document.getElementById('order-detail-title').textContent = 'Détail de la commande ' + reference;
                                                  const body = document.getElementById('order-detail-body');
                                                  body.innerHTML = 'Chargement...';
                                                  document.getElementById('order-detail-cancel-error').style.display = 'none';

                                                  const footer = document.getElementById('order-detail-footer');
                                                  const cancelBtn = document.getElementById('order-detail-cancel-btn');
                                                  const canCancel = currentUser.role === 'ADMIN' && statusDisplay !== 'annulée' && statusDisplay !== 'supprimée';
                                                  footer.style.display = canCancel ? '' : 'none';
                                                  if (canCancel) {
                                                       cancelBtn.disabled = false;
                                                       cancelBtn.textContent = 'Annuler cette commande sur RPOS';
                                                       cancelBtn.onclick = async function () {
                                                            if (!confirm('Annuler définitivement la commande ' + reference + ' sur RPOS ? Cette action est irréversible.')) return;
                                                            cancelBtn.disabled = true;
                                                            cancelBtn.textContent = 'Annulation en cours...';
                                                            try {
                                                                 const shopId = selectedShopId();
                                                                 const posId = selectedPosId();
                                                                 const res = await window.reassortFetch('/reassort/orders/' + encodeURIComponent(orderId) + '/cancel?shop=' + encodeURIComponent(shopId) + '&pos=' + encodeURIComponent(posId), { method: 'POST' });
                                                                 const json = await res.json();
                                                                 if (!json.success) throw new Error(json.message);
                                                                 getOrderDetailModal().hide();
                                                                 loadOrders();
                                                            } catch (err) {
                                                                 const errBox = document.getElementById('order-detail-cancel-error');
                                                                 errBox.textContent = 'Erreur: ' + err.message;
                                                                 errBox.style.display = 'block';
                                                                 cancelBtn.disabled = false;
                                                                 cancelBtn.textContent = 'Annuler cette commande sur RPOS';
                                                            }
                                                       };
                                                  }

                                                  getOrderDetailModal().show();
                                                  try {
                                                       const shopId = selectedShopId();
                                                       const res = await window.reassortFetch('/reassort/orders/' + encodeURIComponent(orderId) + '/detail?shop=' + encodeURIComponent(shopId));
                                                       const json = await res.json();
                                                       if (!json.success) throw new Error(json.message);
                                                       const proposal = json.data;
                                                       const lines = proposal.lines || [];
                                                       if (!lines.length) {
                                                            body.innerHTML = '<p class="text-muted mb-0">Aucun article trouvé pour cette commande.</p>';
                                                            return;
                                                       }
                                                       const total = lines.reduce(function (sum, l) {
                                                            return sum + (l.sellingPrice || 0) * (l.quantityValidated !== null && l.quantityValidated !== undefined ? l.quantityValidated : l.quantitySuggested);
                                                       }, 0);
                                                       body.innerHTML = '<div class="table-responsive"><table class="table table-sm table-centered mb-2">' +
                                                            '<thead><tr><th>EAN</th><th>Article</th><th class="text-end">Qté proposée</th><th class="text-end">Qté envoyée</th><th class="text-end">Prix vente</th><th class="text-end">Valeur</th></tr></thead><tbody>' +
                                                            lines.map(function (l) {
                                                                 const qtySent = l.quantityValidated !== null && l.quantityValidated !== undefined ? l.quantityValidated : l.quantitySuggested;
                                                                 const value = (l.sellingPrice || 0) * qtySent;
                                                                 return '<tr>' +
                                                                      '<td>' + l.ean + '</td>' +
                                                                      '<td>' + l.label + '</td>' +
                                                                      '<td class="text-end">' + l.quantitySuggested + '</td>' +
                                                                      '<td class="text-end fw-semibold">' + qtySent + '</td>' +
                                                                      '<td class="text-end">' + (l.sellingPrice ? l.sellingPrice.toLocaleString('fr-FR') + ' CFA' : '—') + '</td>' +
                                                                      '<td class="text-end">' + value.toLocaleString('fr-FR') + ' CFA' + '</td>' +
                                                                      '</tr>';
                                                            }).join('') +
                                                            '</tbody></table></div>' +
                                                            '<p class="text-end fw-semibold mb-0">Total envoyé : ' + total.toLocaleString('fr-FR') + ' CFA</p>';
                                                  } catch (err) {
                                                       body.innerHTML = '<div class="alert alert-warning mb-0">' + err.message + '</div>';
                                                  }
                                             }

                                             tbody.addEventListener('click', function (e) {
                                                  const row = e.target.closest('.order-row');
                                                  if (!row) return;
                                                  showOrderDetail(row.dataset.orderId, row.dataset.orderReference, row.dataset.orderStatus);
                                             });

                                             async function loadOrders() {
                                                  updateTitle();
                                                  const shopId = selectedShopId();
                                                  if (!shopId) {
                                                       tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Sélectionnez un magasin.</td></tr>';
                                                       return;
                                                  }
                                                  status.textContent = 'Chargement...';
                                                  refreshBtn.disabled = true;
                                                  try {
                                                       const posId = selectedPosId();
                                                       const res = await window.reassortFetch('/reassort/orders?shop=' + encodeURIComponent(shopId) + (posId ? '&pos=' + encodeURIComponent(posId) : ''));
                                                       const json = await res.json();
                                                       if (!json.success) throw new Error(json.message);
                                                       renderRows(json.data.orders);
                                                       status.textContent = json.data.count + ' commande(s) au total';
                                                  } catch (err) {
                                                       tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger py-4">Erreur: ' + err.message + '</td></tr>';
                                                       status.textContent = '';
                                                  } finally {
                                                       refreshBtn.disabled = false;
                                                  }
                                             }

                                             refreshBtn.addEventListener('click', loadOrders);
                                             initShopPicker().then(loadOrders);
                                        })();
                                   </script>
                              </div>
                         </div>
     
                    </div>

               </div>
               <!-- End Container Fluid -->

               <!-- ========== Footer Start ========== -->
               <footer class="footer">
                   <div class="container-fluid">
                       <div class="row">
                           <div class="col-12 text-center">
                               <script>document.write(new Date().getFullYear())</script> &copy; Réassort Automatique.
                           </div>
                       </div>
                   </div>
               </footer>
               <!-- ========== Footer End ========== -->
          </div>
          <!-- /container-xxl -->
     </div>
     <!-- /py-4 -->
     </main>
     <!-- ========== /Volt main content ========== -->

     <!-- Volt vendor JS (Require in all Page) -->
     <script src="assets/volt/vendor/@popperjs/core/dist/umd/popper.min.js"></script>
     <script src="assets/volt/vendor/bootstrap/dist/js/bootstrap.min.js"></script>
     <script src="assets/volt/vendor/simplebar/dist/simplebar.min.js"></script>
</body>

</html>
