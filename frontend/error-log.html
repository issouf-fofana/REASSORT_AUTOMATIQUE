<!DOCTYPE html>
<html lang="fr">

<head>
     <meta charset="utf-8" />
     <title>Journal des erreurs | Réassort Automatique</title>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta http-equiv="X-UA-Compatible" content="IE=edge" />
     <link rel="icon" type="image/png" href="assets/images/logo-reassort.png">

     <link type="text/css" href="assets/volt/css/volt.css" rel="stylesheet">
     <link type="text/css" href="assets/css/theme-override.css" rel="stylesheet">

     <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1/dist/iconify-icon.min.js"></script>

     <script src="assets/js/config.js"></script>
     <script src="assets/js/backend-config.js"></script>
     <script src="assets/js/reassort-auth.js"></script>
     <script src="assets/js/shop-picker.js"></script>
</head>

<body data-page-title="Journal des erreurs">

     <script src="assets/js/loading-overlay.js"></script>

     <div id="layout-sidebar-slot"></div>

     <button type="button" id="reset-layout" class="visually-hidden" aria-hidden="true" tabindex="-1"></button>

     <main class="content">
          <div id="layout-topbar-slot"></div>
          <script src="assets/js/layout.js"></script>
          <script src="assets/js/global-shop-selector.js"></script>

          <div class="py-4">
               <div class="container-xxl">

                    <div class="card mb-3">
                         <div class="card-body">
                              <div class="alert alert-light border small mb-0">
                                   <strong>À quoi ça sert :</strong> chaque erreur serveur (code 5xx) survenue
                                   sur l'API est enregistrée automatiquement ici, avec l'URL appelée, le message
                                   exact, la personne connectée au moment de l'erreur et l'horodatage — ces
                                   mêmes erreurs sont aussi écrites dans les logs du conteneur (visibles dans
                                   Dokploy).
                              </div>
                         </div>
                    </div>

                    <div class="card mb-3">
                         <div class="card-body d-flex flex-wrap gap-2 align-items-center">
                              <input type="text" id="el-search" class="form-control" placeholder="Rechercher dans l'URL ou le message..." style="max-width: 320px;">
                              <select id="el-status" class="form-select" style="max-width: 160px;">
                                   <option value="">Tous les codes</option>
                                   <option value="500">500</option>
                                   <option value="502">502</option>
                                   <option value="503">503</option>
                                   <option value="504">504</option>
                              </select>
                              <button type="button" id="el-refresh" class="btn btn-outline-secondary">Actualiser</button>
                              <span id="el-summary" class="small text-muted ms-auto"></span>
                         </div>
                    </div>

                    <div id="el-list"></div>

               </div>
          </div>
     </main>

     <script src="assets/volt/vendor/@popperjs/core/dist/umd/popper.min.js"></script>
     <script src="assets/volt/vendor/bootstrap/dist/js/bootstrap.min.js"></script>
     <script src="assets/volt/vendor/simplebar/dist/simplebar.min.js"></script>
     <script src="assets/js/error-log.js"></script>
     <script src="assets/js/ai-assistant-widget.js"></script>

</body>

</html>
