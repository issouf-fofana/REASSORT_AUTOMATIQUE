<!DOCTYPE html>
<html lang="en">

<head>
     <!-- Title Meta -->
     <meta charset="utf-8" />
     <title>Utilisateurs | Réassort Automatique</title>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta http-equiv="X-UA-Compatible" content="IE=edge" />
     <link rel="icon" type="image/png" href="assets/images/logo-reassort.png">

     <!-- Volt Bootstrap 5 Dashboard (page pilote de migration) : CSS compilée depuis
          template-volt-src/ + template/volt-bootstrap-5-dashboard (gulp build:dev), copiée dans
          assets/volt/. Remplace entièrement vendor.min.css/icons.min.css/app.min.css (Larkon). -->
     <link type="text/css" href="assets/volt/css/volt.css" rel="stylesheet">
     <link type="text/css" href="assets/css/theme-override.css" rel="stylesheet">

     <!-- Iconify (icônes <iconify-icon> déjà utilisées partout dans cette page) : Larkon la fournissait
          via vendor.js, absent du build Volt. Chargée séparément pour ne pas réécrire ~30 icônes. -->
     <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1/dist/iconify-icon.min.js"></script>

     <!-- Theme Config js (Require in all Page) -->
     <script src="assets/js/config.js"></script>
    <script src="assets/js/backend-config.js"></script>
    <script src="assets/js/reassort-auth.js"></script>
    <script src="assets/js/shop-picker.js"></script>

    <style>
         .step-icon-wrap { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
         .step-icon-wrap iconify-icon { font-size: 20px; }
         .step-icon-wrap.state-active iconify-icon { animation: step-spin 1s linear infinite; }
         @keyframes step-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
         .validation-step { transition: background-color .3s ease, opacity .3s ease; opacity: .55; }
         .validation-step.state-active, .validation-step.state-done, .validation-step.state-error { opacity: 1; }
         .validation-step.state-active { background-color: rgba(35, 97, 206, .06); }
         /* Volt attend des libellés de menu courts (nowrap) ; les nôtres sont plus longs
            ("Proposition de commande"...) donc on autorise le retour à la ligne pour éviter
            le débordement horizontal du panneau latéral. */
         .sidebar .nav, .sidebar .multi-level .nav { white-space: normal; }
    </style>
</head>

<body data-page-title="Utilisateurs">

     <script src="assets/js/loading-overlay.js"></script>

     <div id="layout-sidebar-slot"></div>

     <button type="button" id="reset-layout" class="visually-hidden" aria-hidden="true" tabindex="-1"></button>

     <main class="content">
          <div id="layout-topbar-slot"></div>
          <script src="assets/js/layout.js"></script>
          <script src="assets/js/global-shop-selector.js"></script>

          <div class="py-4">
               <div class="container-xxl">               <!-- Start Container Fluid -->
               <div class="container-xxl">

                    <div id="users-access-denied" class="alert alert-danger" style="display:none;">
                         Cette page est réservée aux administrateurs.
                    </div>

                    <div id="users-page-content" style="display:none;">
                         <div class="row">
                              <div class="col-xl-4">
                                   <div class="card">
                                        <div class="card-header">
                                             <h4 class="card-title">Nouveau compte</h4>
                                        </div>
                                        <div class="card-body">
                                             <div id="create-user-error" class="alert alert-danger" style="display:none;"></div>
                                             <form id="create-user-form">
                                                  <div class="mb-3">
                                                       <label class="form-label">Nom</label>
                                                       <input type="text" id="new-user-name" class="form-control" required>
                                                  </div>
                                                  <div class="mb-3">
                                                       <label class="form-label">Email</label>
                                                       <input type="email" id="new-user-email" class="form-control" required>
                                                  </div>
                                                  <div class="mb-3">
                                                       <label class="form-label">Mot de passe</label>
                                                       <input type="password" id="new-user-password" class="form-control" required minlength="6">
                                                  </div>
                                                  <div class="mb-3">
                                                       <label class="form-label">Rôle</label>
                                                       <select id="new-user-role" class="form-select">
                                                            <option value="STORE">Magasin (accès à un seul magasin)</option>
                                                            <option value="SUPERVISOR">Superviseur (accès à plusieurs magasins choisis)</option>
                                                            <option value="ADMIN">Administrateur (accès à tous les magasins)</option>
                                                       </select>
                                                  </div>
                                                  <div class="mb-3" id="new-user-shop-wrapper">
                                                       <label class="form-label">Magasin assigné</label>
                                                       <select id="new-user-shop" class="form-select" required>
                                                            <option value="">Chargement des magasins...</option>
                                                       </select>
                                                  </div>
                                                  <div class="mb-3" id="new-user-supervised-wrapper" style="display:none;">
                                                       <label class="form-label">Magasins supervisés</label>
                                                       <div id="new-user-supervised-checklist" class="border rounded p-2" style="max-height: 220px; overflow-y: auto;">
                                                            <div class="text-muted small">Chargement des magasins...</div>
                                                       </div>
                                                  </div>
                                                  <button type="submit" id="create-user-submit" class="btn btn-primary w-100">Créer le compte</button>
                                             </form>
                                        </div>
                                   </div>
                              </div>

                              <div class="col-xl-8">
                                   <div class="card">
                                        <div class="d-flex card-header justify-content-between align-items-center">
                                             <h4 class="card-title">Comptes existants</h4>
                                             <button id="users-refresh" class="btn btn-sm btn-outline-primary">Actualiser</button>
                                        </div>
                                        <div class="card-body p-0">
                                             <div class="table-responsive">
                                                  <table class="table align-middle mb-0 table-hover table-centered">
                                                       <thead class="bg-light-subtle">
                                                            <tr>
                                                                 <th>Nom</th>
                                                                 <th>Email</th>
                                                                 <th>Rôle</th>
                                                                 <th>Magasin</th>
                                                                 <th>Statut</th>
                                                                 <th>Action</th>
                                                            </tr>
                                                       </thead>
                                                       <tbody id="users-tbody">
                                                            <tr><td colspan="6" class="text-center text-muted py-4">Chargement...</td></tr>
                                                       </tbody>
                                                  </table>
                                             </div>
                                        </div>
                                   </div>
                              </div>
                         </div>
                    </div>

                    <!-- Réinitialisation du mot de passe (ADMIN uniquement) : le formulaire de création ne
                         permet de saisir un mot de passe qu'à la création du compte — sans ce modal, un
                         admin n'avait aucun moyen de dépanner un utilisateur ayant oublié le sien (pas
                         d'email, pas de "mot de passe oublié" côté appli). Réutilise PUT /users/:id qui
                         acceptait déjà un `password` optionnel côté backend, jusqu'ici jamais exposé ici. -->
                    <div class="modal fade" id="reset-password-modal" tabindex="-1" aria-hidden="true">
                         <div class="modal-dialog">
                              <div class="modal-content">
                                   <div class="modal-header">
                                        <h5 class="modal-title">Réinitialiser le mot de passe</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                   </div>
                                   <form id="reset-password-form">
                                        <div class="modal-body">
                                             <p class="text-muted" id="reset-password-target"></p>
                                             <div id="reset-password-error" class="alert alert-danger" style="display:none;"></div>
                                             <div class="mb-3">
                                                  <label class="form-label">Nouveau mot de passe</label>
                                                  <input type="password" id="reset-password-value" class="form-control" required minlength="6">
                                             </div>
                                        </div>
                                        <div class="modal-footer">
                                             <button type="button" class="btn btn-light" data-bs-dismiss="modal">Annuler</button>
                                             <button type="submit" id="reset-password-submit" class="btn btn-primary">Réinitialiser</button>
                                        </div>
                                   </form>
                              </div>
                         </div>
                    </div>

                    <script>
                         (function () {
                              const currentUser = window.reassortGetUser();
                              if (!currentUser || currentUser.role !== 'ADMIN') {
                                   document.getElementById('users-access-denied').style.display = 'block';
                                   return;
                              }
                              document.getElementById('users-page-content').style.display = 'block';

                              const roleSelect = document.getElementById('new-user-role');
                              const shopWrapper = document.getElementById('new-user-shop-wrapper');
                              const shopSelect = document.getElementById('new-user-shop');
                              const supervisedWrapper = document.getElementById('new-user-supervised-wrapper');
                              const supervisedChecklist = document.getElementById('new-user-supervised-checklist');
                              const form = document.getElementById('create-user-form');
                              const errorBox = document.getElementById('create-user-error');
                              const submitBtn = document.getElementById('create-user-submit');
                              const usersTbody = document.getElementById('users-tbody');
                              const refreshBtn = document.getElementById('users-refresh');

                              let shopsList = [];

                              async function loadShops() {
                                   try {
                                        const res = await window.reassortFetch('/reassort/shops');
                                        const json = await res.json();
                                        if (!json.success) throw new Error(json.message);
                                        shopsList = json.data;
                                        const byPos = {};
                                        shopsList.forEach(function (s) {
                                             if (!byPos[s.posId]) byPos[s.posId] = [];
                                             byPos[s.posId].push(s);
                                        });
                                        shopSelect.innerHTML = Object.keys(byPos).sort(function (a, b) { return parseInt(a.replace(/\D/g, ''), 10) - parseInt(b.replace(/\D/g, ''), 10); }).map(function (posId) {
                                             const shops = byPos[posId].slice().sort(function (a, b) { return (a.reference||'').localeCompare(b.reference||''); });
                                             const options = shops.map(function (s) {
                                                  return '<option value="' + s.id + '" data-pos-id="' + s.posId + '" data-reference="' + s.reference + '" data-name="' + s.name + '">' + s.reference + ' - ' + s.name + '</option>';
                                             }).join('');
                                             return '<optgroup label="' + (shops[0].posLabel || posId) + '">' + options + '</optgroup>';
                                        }).join('');
                                        window.reassortMakeShopPickerSearchable(shopSelect);
                                   } catch (err) {
                                        shopSelect.innerHTML = '<option value="">Erreur: ' + err.message + '</option>';
                                   }

                                   supervisedChecklist.innerHTML = shopsList.map(function (s, i) {
                                        return '<div class="form-check">' +
                                             '<input class="form-check-input" type="checkbox" value="' + i + '" id="supervised-check-' + i + '">' +
                                             '<label class="form-check-label" for="supervised-check-' + i + '">' + s.reference + ' - ' + s.name + '</label>' +
                                             '</div>';
                                   }).join('');
                              }

                              roleSelect.addEventListener('change', function () {
                                   shopWrapper.style.display = roleSelect.value === 'STORE' ? 'block' : 'none';
                                   shopSelect.required = roleSelect.value === 'STORE';
                                   supervisedWrapper.style.display = roleSelect.value === 'SUPERVISOR' ? 'block' : 'none';
                              });

                              form.addEventListener('submit', async function (e) {
                                   e.preventDefault();
                                   errorBox.style.display = 'none';
                                   submitBtn.disabled = true;

                                   const role = roleSelect.value;
                                   const selectedOption = shopSelect.options[shopSelect.selectedIndex];

                                   const payload = {
                                        name: document.getElementById('new-user-name').value,
                                        email: document.getElementById('new-user-email').value,
                                        password: document.getElementById('new-user-password').value,
                                        role: role,
                                   };
                                   if (role === 'STORE' && selectedOption) {
                                        payload.rposShopId = selectedOption.value;
                                        payload.rposShopReference = selectedOption.dataset.reference;
                                        payload.rposShopName = selectedOption.dataset.name;
                                        payload.rposPosId = selectedOption.dataset.posId;
                                   }
                                   if (role === 'SUPERVISOR') {
                                        const checked = Array.from(supervisedChecklist.querySelectorAll('input:checked'));
                                        payload.supervisedShops = checked.map(function (c) {
                                             const s = shopsList[parseInt(c.value, 10)];
                                             return { rposShopId: s.id, rposShopReference: s.reference, rposShopName: s.name, rposPosId: s.posId };
                                        });
                                        if (payload.supervisedShops.length === 0) {
                                             errorBox.textContent = 'Sélectionnez au moins un magasin à superviser.';
                                             errorBox.style.display = 'block';
                                             submitBtn.disabled = false;
                                             return;
                                        }
                                   }

                                   try {
                                        const res = await window.reassortFetch('/users', {
                                             method: 'POST',
                                             headers: { 'Content-Type': 'application/json' },
                                             body: JSON.stringify(payload),
                                        });
                                        const json = await res.json();
                                        if (!json.success) throw new Error(json.message);

                                        form.reset();
                                        roleSelect.dispatchEvent(new Event('change'));
                                        loadUsers();
                                   } catch (err) {
                                        errorBox.textContent = err.message;
                                        errorBox.style.display = 'block';
                                   } finally {
                                        submitBtn.disabled = false;
                                   }
                              });

                              async function loadUsers() {
                                   usersTbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">Chargement...</td></tr>';
                                   try {
                                        const res = await window.reassortFetch('/users');
                                        const json = await res.json();
                                        if (!json.success) throw new Error(json.message);

                                        if (!json.data.length) {
                                             usersTbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">Aucun compte.</td></tr>';
                                             return;
                                        }

                                        usersTbody.innerHTML = json.data.map(function (u) {
                                             let shopLabel;
                                             if (u.role === 'ADMIN') {
                                                  shopLabel = '<span class="text-muted">Tous magasins</span>';
                                             } else if (u.role === 'SUPERVISOR') {
                                                  const shops = u.supervisedShops || [];
                                                  shopLabel = shops.length
                                                       ? shops.map(function (s) { return s.rposShopReference; }).join(', ')
                                                       : '<span class="text-danger">Aucun magasin</span>';
                                             } else {
                                                  shopLabel = u.rposShopReference ? u.rposShopReference + ' - ' + u.rposShopName : '<span class="text-danger">Non assigné</span>';
                                             }
                                             const roleLabel = u.role === 'ADMIN' ? 'Administrateur' : (u.role === 'SUPERVISOR' ? 'Superviseur' : 'Magasin');
                                             const statusBadge = u.isActive
                                                  ? '<span class="badge bg-success-subtle text-success py-1 px-2">Actif</span>'
                                                  : '<span class="badge bg-secondary-subtle text-secondary py-1 px-2">Désactivé</span>';
                                             return '<tr>' +
                                                  '<td>' + u.name + '</td>' +
                                                  '<td>' + u.email + '</td>' +
                                                  '<td>' + roleLabel + '</td>' +
                                                  '<td>' + shopLabel + '</td>' +
                                                  '<td>' + statusBadge + '</td>' +
                                                  '<td>' +
                                                       '<div class="d-flex gap-1">' +
                                                       '<button class="btn btn-sm btn-outline-secondary toggle-user-btn" data-id="' + u.id + '" data-active="' + u.isActive + '">' +
                                                            (u.isActive ? 'Désactiver' : 'Réactiver') +
                                                       '</button>' +
                                                       '<button class="btn btn-sm btn-outline-primary reset-password-btn" data-id="' + u.id + '" data-email="' + u.email + '" data-name="' + u.name + '">' +
                                                            'Réinitialiser le mot de passe' +
                                                       '</button>' +
                                                       '</div>' +
                                                  '</td>' +
                                                  '</tr>';
                                        }).join('');

                                        document.querySelectorAll('.toggle-user-btn').forEach(function (btn) {
                                             btn.addEventListener('click', async function () {
                                                  const id = btn.dataset.id;
                                                  const isActive = btn.dataset.active === 'true';
                                                  btn.disabled = true;
                                                  try {
                                                       await window.reassortFetch('/users/' + id, {
                                                            method: 'PUT',
                                                            headers: { 'Content-Type': 'application/json' },
                                                            body: JSON.stringify({ isActive: !isActive }),
                                                       });
                                                       loadUsers();
                                                  } catch (err) {
                                                       btn.disabled = false;
                                                  }
                                             });
                                        });

                                        document.querySelectorAll('.reset-password-btn').forEach(function (btn) {
                                             btn.addEventListener('click', function () {
                                                  resetPasswordTargetId = btn.dataset.id;
                                                  resetPasswordError.style.display = 'none';
                                                  resetPasswordForm.reset();
                                                  resetPasswordTargetLabel.textContent = 'Compte : ' + btn.dataset.name + ' (' + btn.dataset.email + ')';
                                                  getResetPasswordModal().show();
                                             });
                                        });
                                   } catch (err) {
                                        usersTbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger py-4">Erreur: ' + err.message + '</td></tr>';
                                   }
                              }

                              // Modal de réinitialisation de mot de passe : un admin dépanne ainsi un
                              // utilisateur qui a oublié le sien (aucun flux "mot de passe oublié" côté
                              // appli — pas d'envoi d'email — donc ça passe nécessairement par un admin).
                              let resetPasswordTargetId = null;
                              let resetPasswordModal = null;
                              // Instancié à la demande : `bootstrap` (vendor JS) n'est chargé qu'en bas
                              // de la page, après ce script inline (même pattern que settings.html).
                              function getResetPasswordModal() {
                                   if (!resetPasswordModal) {
                                        resetPasswordModal = new bootstrap.Modal(document.getElementById('reset-password-modal'));
                                   }
                                   return resetPasswordModal;
                              }
                              const resetPasswordForm = document.getElementById('reset-password-form');
                              const resetPasswordError = document.getElementById('reset-password-error');
                              const resetPasswordTargetLabel = document.getElementById('reset-password-target');
                              const resetPasswordSubmit = document.getElementById('reset-password-submit');

                              resetPasswordForm.addEventListener('submit', async function (e) {
                                   e.preventDefault();
                                   resetPasswordError.style.display = 'none';
                                   resetPasswordSubmit.disabled = true;
                                   try {
                                        const res = await window.reassortFetch('/users/' + resetPasswordTargetId, {
                                             method: 'PUT',
                                             headers: { 'Content-Type': 'application/json' },
                                             body: JSON.stringify({ password: document.getElementById('reset-password-value').value }),
                                        });
                                        const json = await res.json();
                                        if (!json.success) throw new Error(json.message);
                                        getResetPasswordModal().hide();
                                   } catch (err) {
                                        resetPasswordError.textContent = err.message;
                                        resetPasswordError.style.display = 'block';
                                   } finally {
                                        resetPasswordSubmit.disabled = false;
                                   }
                              });

                              refreshBtn.addEventListener('click', loadUsers);
                              loadShops();
                              loadUsers();
                         })();
                    </script>

               </div>
               <!-- End Container Fluid -->

               <!-- ========== Footer Start ========== -->
               <footer class="footer">
                   <div class="container-fluid">
                       <div class="row">
                           <div class="col-12 text-center">
                               <script>document.write(new Date().getFullYear())</script> &copy; Réassort Automatique.
                           </div>
                       </div>
                   </div>
               </footer>
               <!-- ========== Footer End ========== -->
          </div>
          <!-- /container-xxl -->
     </div>
     <!-- /py-4 -->
     </main>
     <!-- ========== /Volt main content ========== -->

     <!-- Volt vendor JS (Require in all Page) -->
     <script src="assets/volt/vendor/@popperjs/core/dist/umd/popper.min.js"></script>
     <script src="assets/volt/vendor/bootstrap/dist/js/bootstrap.min.js"></script>
     <script src="assets/volt/vendor/simplebar/dist/simplebar.min.js"></script>
     <script src="assets/js/ai-assistant-widget.js"></script>

</body>

</html>
